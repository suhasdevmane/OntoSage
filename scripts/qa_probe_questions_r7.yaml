# Round-7 probe questions for scripts/qa_probe.py (--pool scripts/qa_probe_questions_r7.yaml).
# Written 2026-10-11 by stakeholder group (the 13 groups of
# tasks/PLAN_2026-10-11_STAKEHOLDER_INTENT_COVERAGE.md), mixing lay and expert wording and every
# intent shape (now, past period, trend/plot, forecast, where/how to get there, procedure, records,
# judgement, multi-criteria). A routing and delivery check read by hand, NOT an evaluation set and
# never evidence about unseen questions. No Paper 3 study task, room, date or criterion is used.
