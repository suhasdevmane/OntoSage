# ---------------------------------------------------------------------------
# Layer mapping for "Abacws floor 0.dwg"
#
# Layer names below were read off the AutoCAD Web layer panel. Several were
# truncated in the UI (CSM-STL-XX-ZZ-...), so the matching is done with
# case-insensitive glob patterns rather than exact strings. Run
#     python -m pipeline.cli layers abacws_floor0.dxf
# to print the real layer table, then tighten these patterns.
# ---------------------------------------------------------------------------

building:
  id: Abacws
  name: "Abacws Building"
  site: "Cardiff University"

storey:
  id: "Storey_00"
  name: "Ground Floor"
  level: 0

# Drawing units -> metres. AutoCAD architectural DWGs from UK practices are
# almost always millimetres. Verify with: cli.py units <file.dxf>
units_to_metres: 0.001

geometry:
  # Closed polylines on these layers become bot:Space boundaries.
  room_boundary_layers:
    - "USABLE"
    - "POLYLINES"
  # Ignore slivers and hatch fragments (square metres, after unit scaling).
  min_room_area_m2: 1.5
  # Two spaces are bot:adjacentZone if their boundaries run together for at
  # least this distance (metres) - filters out corner touches.
  min_shared_boundary_m: 0.4
  # Tolerance for "boundaries touch" and for binding a door to its rooms.
  tolerance_m: 0.35
  # Recurse into block references when harvesting geometry and text.
  explode_block_references: true

labels:
  # TEXT / MTEXT on these layers is joined to whichever space contains it.
  layers:
    - "ROOM_NAMES"
    - "ROOM ASSIGNMENT"
    - "PRSNAMES"
    - "A-AREA-IDEN"
  # A label matching this is treated as the room code; the rest becomes the
  # room name. Covers both schemes seen in the drawing: 0Z21 / 0Z19 / 0.29
  code_pattern: '^([0-9]{1,2}[A-Z][0-9]{1,3}|[0-9]{1,2}\.[0-9]{1,3})$'

# DIMENSION entities carry a `measurement` the CAD application computed from
# the real geometry - a fact about the building, not a drawn label. They are
# collected even when their layer appears in ignore_layers, because the layer
# is visual clutter for room extraction while the numbers themselves are not.
dimensions:
  enabled: true
  # Empty list = take dimensions from every layer. Narrow it if the drawing
  # has survey or setting-out dimensions you do not want.
  layers: []
  # Sanity bounds in metres - filters corrupt values and stray annotation.
  min_measurement_m: 0.05
  max_measurement_m: 500.0

# Block references on these layers become bot:Element instances, typed with
# the given Brick class. Patterns are case-insensitive globs.
elements:
  - pattern: "*E-ELEC-EQPI*"
    brick_class: "Electrical_Equipment"
    label: "Electrical equipment"
  - pattern: "*E-ELEC-FI*"
    brick_class: "Electrical_Equipment"
    label: "Electrical fitting"
  - pattern: "*I-FURN*"
    brick_class: "Furniture"
    label: "Furniture"
  - pattern: "SANITARY"
    brick_class: "Equipment"
    label: "Sanitary fitting"
  - pattern: "WASTE & RECYCLING STATION"
    brick_class: "Equipment"
    label: "Waste and recycling station"

# Doors create brick:Door elements AND bot:Interface connectivity edges
# between the two spaces they sit between. Detected by layer or block name.
doors:
  layer_patterns:
    - "*A-DOOR*"
    - "*DOOR*"
  block_name_patterns:
    - "*DOOR*"
    - "*DR_*"

# Layers that carry no queryable meaning - excluded from the graph entirely.
ignore_layers:
  - "A-ANNO-DIMS"
  - "A-DETL-THIN"
  - "A-DETL-WIDE"
  - "AECFROZEN"
  - "TITLE_BLK"
  - "VPORT"
  - "DEFPOINTS"

# ---------------------------------------------------------------------------
# Room boundary tracing - the BOUNDARY / BPOLY equivalent.
#   python -m pipeline.cli rooms "Abacws floor 5.dxf" --dry-run
# ---------------------------------------------------------------------------
rooms:
  wall_layers: ["A-WALL", "I-WALL"]

  # Door layers are part of the wall network, not decoration. A doorway is a
  # real gap in the wall lines; only the door block's threshold lines seal it.
  # Omit these and every room leaks into its neighbour through every door.
  door_layers: ["A-DOOR"]

  # Swing arcs are excluded by default - they would carve a curved bite out of
  # the room. Only set true if this drawing's doors have no threshold lines and
  # the arc is the only thing closing the opening.
  include_door_curves: false

  room_text_layers: ["A-AREA-IDEN"]

  # Digit, dot, two digits - e.g. 5.05, 0.12.
  # WARNING: floor 0 also carries codes like 0Z19 and 0Z21, which this pattern
  # does NOT match. Widen it to
  #   ^([0-9]{1,2}\.[0-9]{2}|[0-9]{1,2}[A-Z][0-9]{1,3})$
  # if those rooms are wanted too.
  room_pattern: '^\d\.\d{2}$'

  min_area_m2: 1.0
  max_area_m2: 2000.0

  # A traced region must be at least 2 x this across at its widest point.
  # Catches a pick point that landed inside a wall cavity - a long thin cavity
  # has plenty of area, so an area test alone does not catch it.
  min_inradius_m: 0.3
