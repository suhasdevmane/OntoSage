# input/bldg1/rules.yaml — ECA rules for the Abacws building (T20)
#
# Each rule: id, name, enabled, trigger, action.
# trigger.sensor_uuid: direct UUID from MySQL sensor_data column.
# trigger.concept: HBCO concept (resolved to Brick class -> UUIDs at runtime).
# trigger.scope:   REQUIRED on a concept rule — `all` or `first_reporting`.
# trigger.floor / trigger.space: optional spatial scope (TODO-528). Resolved through the
#   graph's own hierarchy (sensor -> brick:hasLocation -> ...isPartOf/hasPart... ->
#   brick:Floor), never by reading a floor number out of a sensor's name. The value is
#   matched against the floor's or space's own IRI local name and rdfs:label, so "3",
#   "Floor3" and "Floor 3 (Third Floor)" all name the same floor. A scope matching no
#   point leaves the rule watching NOTHING and says so in the log — it never falls back
#   to a point elsewhere in the building.
# trigger.duration_min: how many minutes the condition must be sustained before firing.
# action.type: notify (Phase F) — future Phase G adds actuate.
# Cooldown: rules re-fire at most once per 30 minutes per sensor.

rules:

  # ── Air quality rules (Floor 5 — live sensors) ────────────────────────────

  - id: co2_high_room501
    name: CO2 elevated in room 5.01
    enabled: true
    trigger:
      sensor_uuid: "a66ca165-1e06-4901-a997-780fafc8581a"   # CO2_Level_Sensor_5.01
      op: ">"
      threshold: 1000.0
      duration_min: 10
    action:
      type: notify
      message: "CO2 is {value:.0f} ppm in room 5.01 (threshold {threshold:.0f} ppm sustained {duration_min} min). Consider ventilation."
      severity: warning

  - id: temp_high_room508
    name: Temperature too high in room 5.08
    enabled: true
    trigger:
      sensor_uuid: "41b35030-1ca2-4906-9c63-16af59d8c7ad"   # Air_Temperature_Sensor_5.08
      op: ">"
      threshold: 27.0
      duration_min: 15
    action:
      type: notify
      message: "Temperature is {value:.1f}°C in room 5.08 (above {threshold:.0f}°C for {duration_min} min). Check HVAC."
      severity: warning

  - id: humidity_damp_floor3
    name: High humidity — possible damp — floor 3
    enabled: true
    trigger:
      concept: "damp"
      op: ">"
      threshold: 65.0
      duration_min: 30
      # WHERE (TODO-528). The rule's NAME used to be the only place "floor 3" existed, and
      # a name enforces nothing: the trigger had no spatial qualifier, so this rule watched
      # one humidity sensor that could have been on any floor.
      floor: "3"
      # WHAT, within that where (V12-20, BUG-482). A concept resolves to a Brick CLASS and
      # a class has many points, so a concept rule must say whether it means all of them or
      # one. It was `first_reporting` only because `all` without a floor would have notified
      # about humidity across the whole building under a rule whose name promises one floor.
      # With the floor declared, `all` is what the rule has always claimed to be: every
      # humidity point on floor 3.
      scope: all
    action:
      type: notify
      # {sensor} names the point that breached — with scope:all a single cycle can raise
      # several of these, and without it every one would read identically apart from the
      # number. {floor}/{space} are also available.
      message: "Humidity is {value:.0f}% at {sensor} on floor {floor} (above {threshold:.0f}% for {duration_min} min). Investigate for damp or ventilation issues."
      severity: warning
