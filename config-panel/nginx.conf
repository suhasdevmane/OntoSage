# OntoSage Data Source Console — static SPA + reverse proxy to the orchestrator.
# Same-origin: the browser talks only to this nginx; /api and /auth are proxied
# to the orchestrator container, so there is no CORS or API-base-URL config.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Admin API + auth → orchestrator (service name on the compose network).
    location /api/ {
        proxy_pass http://orchestrator:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }
    location /auth/ {
        proxy_pass http://orchestrator:8000;
        proxy_set_header Host $host;
    }
    location = /health {
        proxy_pass http://orchestrator:8000;
        proxy_set_header Host $host;
    }
    # Chat (in-console query tester) → orchestrator. Long read timeout: the pipeline
    # runs an LLM, so a response can take several seconds.
    location = /chat {
        proxy_pass http://orchestrator:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
