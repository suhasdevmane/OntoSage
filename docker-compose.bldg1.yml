  # ====================== File Server (Artifacts) ======================
  file-server:
    image: nginx:alpine
    container_name: file-server-artifacts
    ports:
      - "127.0.0.1:8080:80" # localhost-only; artifact file-server (exposed publicly via Cloudflare tunnel if needed)
    volumes:
      - ./volumes/${BUILDING_ID:?BUILDING_ID missing - set it in .env}/artifacts:/usr/share/nginx/html # Artifacts root
      - ./config/nginx-file-server.conf:/etc/nginx/conf.d/default.conf:ro # Custom config (non-nested aliases)
      - ./input:/srv/floor-plan-pdfs:ro # PDFs at /floor-plans/<name>
      - ./volumes/${BUILDING_ID:?BUILDING_ID missing - set it in .env}/floor-plans:/srv/floor-plan-renders:ro # PNGs at /floor-plans/renders/<building>/
      - ./outputs:/srv/static:ro # Analytics/viz plots at /static/<filename>
    networks:
      - ontobot-agentic
    healthcheck:
      # Accept 200 (index exists) or 403 (directory listing disabled — nginx is still live).
      # The original --spider check failed with 403 when the artifacts dir has no index.html.
      test:
        [
          "CMD-SHELL",
          "wget -qS --spider http://127.0.0.1/ 2>&1 | grep -qE 'HTTP/1\\.[01] (200|403)' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ====================== Data Source Console (config panel) ======================
  # Static SPA served by nginx; reverse-proxies /api + /auth to the orchestrator
  # (same-origin, no CORS). Toggle synthetic data sources + view provenance.
  config-panel:
    image: nginx:alpine
    container_name: ontosage-config-panel
    ports:
      - "127.0.0.1:3001:80" # localhost-only admin console
    volumes:
      - ./config-panel/html:/usr/share/nginx/html:ro
      - ./config-panel/nginx.conf:/etc/nginx/conf.d/default.conf:ro
