# bldg1 (Abacws) stack — modernized to per-building state ./volumes/${BUILDING_ID}/*
# (guarded: compose refuses to start if BUILDING_ID is unset). Active building comes
# from .env; input mount ./input. Keeps bldg1's own data-publisher (mysql-dummy-publish-dev).
# OntoSage 3.0: Production-Grade Agentic AI Docker Compose Configuration
# 10 Agents | 14 Intents | Phase 7 services (Response Cache, Agent Memory, WebSocket, i18n)
# Default MODEL_PROVIDER: local (Ollama, default model gpt-oss:20b) — set OPENAI_API_KEY + MODEL_PROVIDER=openai to use OpenAI instead
# Local volumes + Host MySQL on port 3306
# Usage: docker-compose up -d

networks:
  ontobot-agentic:
    driver: bridge
  executor-internal:
    driver: bridge
    internal: true # no gateway to host/internet — isolates the code-executor RCE surface

# All building state is bind-mounted per building at ./volumes/<BUILDING_ID>/* — there
# are no named volumes. The embedding model is baked into the orchestrator image
# (HF_HOME=/app/.hf_cache, HF_HUB_OFFLINE=1), so it needs no cache volume and cannot
# change without a rebuild.

services:
  # ====================== Local LLM (Ollama) with GPU ======================
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: ollama-deepseek-r1
  #   ports:
  #     - "11435:11434"  # Host port changed to avoid conflict
  #   volumes:
  #     - ./volumes/${BUILDING_ID:?BUILDING_ID missing - set it in .env}/ollama:/root/.ollama  # Local persistent storage
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0
  #     - OLLAMA_NUM_GPU=1
  #     - OLLAMA_GPU_LAYERS=-1  # Use all GPU layers for maximum performance
  #     - OLLAMA_KEEP_ALIVE=24h  # Keep model in VRAM for 24 hours
  #     - OLLAMA_NUM_PARALLEL=1
  #     - OLLAMA_NUM_CTX=4096
  #   networks:
  #     - ontobot-agentic
  #   healthcheck:
  #     test: ["CMD", "ollama", "list"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 120s  # Longer for model loading
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - driver: nvidia
  #             count: 1
  #             capabilities: [gpu]
  #   # PROFILE: Only starts with --profile local-gpu (not in default stack)
  #   profiles:
  #     - local-gpu

  # ====================== Ollama Health Sidecar ======================
  # ollama-health:
  #   build:
  #     context: ./ollama-health
  #     dockerfile: Dockerfile
  #   container_name: ollama-health
  #   depends_on:
  #     - ollama
  #   environment:
  #     - OLLAMA_BASE_URL=http://ollama-deepseek-r1:11434
  #     - OLLAMA_MODEL=deepseek-r1:32b
  #   ports:
  #     - "8005:8005"
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #   networks:
  #     - ontobot-agentic
  #   restart: unless-stopped
  #   # PROFILE: Only starts with --profile local-gpu
  #   profiles:
  #     - local-gpu

  # ====================== Open WebUI ======================
  # Always included in the default stack; do not gate behind a profile.
  open-webui:
    image: ghcr.io/open-webui/open-webui:0.8.3
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - ./volumes/${BUILDING_ID:?BUILDING_ID missing - set it in .env}/open-webui:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama-deepseek-r1:11434
      - OPENAI_API_BASE_URL=http://ontosage-orchestrator:8000/v1
      - OPENAI_API_KEY=${PIPELINE_API_KEY}
      # External access via Cloudflare Tunnel → talk2futurebuildings.systems
      - WEBUI_URL=https://talk2futurebuildings.systems
      - ENABLE_WEBSOCKET_SUPPORT=true
      - ENABLE_SIGNUP=true            # allow self-registration (see README: tester onboarding)
      - DEFAULT_USER_ROLE=user        # without this new accounts land in 'pending' and cannot chat
      - BYPASS_MODEL_ACCESS_CONTROL=true   # one shared model: every signed-in user must see it
      - DEFAULT_MODELS=ontobot-pipeline     # preselect the OntoSage pipeline in new chats
      - ENABLE_FORWARD_USER_INFO_HEADERS=true  # send X-OpenWebUI-User-* so OntoSage can apply per-user RBAC
    networks:
      - ontobot-agentic
    restart: unless-stopped

  # ====================== Orchestrator ======================
  orchestrator:
    build:
      context: .
      dockerfile: orchestrator/Dockerfile
      # Build provenance — pass the current commit/time so /health can report which code is running.
      # Both default to "unknown"; build with e.g.
      #   GIT_SHA=$(git rev-parse --short HEAD) BUILD_TIME=$(date -u +%FT%TZ) docker compose build
      args:
        GIT_SHA: "${GIT_SHA:-unknown}"
        BUILD_TIME: "${BUILD_TIME:-unknown}"
    container_name: ontosage-orchestrator
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./orchestrator:/app/orchestrator # Mount source code for hot-reloading
      - ./shared:/app/shared # Mount shared module for hot-reloading
      - ./.env:/app/.env # rw: admin console edits root .env (takes effect on restart)
      - ./input:/app/input # rw: GUI-created data sources persist to input/datasources.custom.yaml
      - ./volumes/${BUILDING_ID:?BUILDING_ID missing - set it in .env}/floor-plans:/app/floor_plans # Writable — pipeline writes manifests + PNGs here
      - ./volumes/${BUILDING_ID:?BUILDING_ID missing - set it in .env}/artifacts:/app/volumes/artifacts # rw: datasource toggle-state + ttl-upload cache
      - ./outputs:/app/outputs # Mount shared outputs (data, plots, query results)
      - ./orchestrator/agents/.env:/app/agents/.env:ro # Mount OpenAI credentials
      - ./data:/app/data:ro # Mount sensor map and other data files
      - ./config:/app/config:ro # Mount alert thresholds and other config files
      - ./ontology:/app/ontology:ro # Building-independent ontologies (HBCO lay-term concepts) — ttl_uploader scans this path
      # NOTE: the embedding model is BAKED INTO THE IMAGE at HF_HOME=/app/.hf_cache
      # (orchestrator/Dockerfile), with HF_HUB_OFFLINE=1 — it is never fetched at
      # runtime and cannot change without a rebuild. No model cache volume is
      # mounted: one used to be, pointing at /root/.cache/huggingface, which HF_HOME
      # does not use — so it sat empty while its comment claimed to cache the model.
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RAG_SERVICE_HOST=rag-service
      - RAG_SERVICE_PORT=8001
      - CODE_EXECUTOR_HOST=code-executor
      - CODE_EXECUTOR_PORT=8002
      - WHISPER_STT_HOST=whisper-stt
      - WHISPER_STT_PORT=8003
      # GraphDB Configuration (replaces Fuseki)
      - GRAPHDB_HOST=graphdb
      - GRAPHDB_PORT=7200
      # ─────────────────────────────────────────────────────────────────
      # MySQL: HOST DATABASE MODE
      # MySQL is running on the HOST machine at port 3306.
      # Docker containers reach host via host.docker.internal.
      # To switch to containerised MySQL:
      #   1. Uncomment the mysql: service block below (~line 460)
      #   2. Change MYSQL_HOST back to: mysql
      - MYSQL_HOST=host.docker.internal # ← host MySQL on port 3306
      # - MYSQL_HOST=mysql                # ← containerised MySQL (mysql-bldg1, alias: mysql)
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-mysql}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-sensordb}
      # ─────────────────────────────────────────────────────────────────
      # MODEL PROVIDER SWITCHING
      # ┌─ MODE A (DEFAULT): Local Ollama ──────────────────────────────────────────┐
      # │ Uses a locally-installed Ollama model — no API credits spent.  │
      # │ Works against Ollama running NATIVELY on the host (just         │
      # │ `ollama serve`, no GPU profile needed — Docker Desktop's        │
      # │ host.docker.internal reaches it) or a containerised GPU Ollama  │
      # │ (`docker compose --profile local-gpu up -d`).                   │
      # └─────────────────────────────────────────────────────────────────┘
      - MODEL_PROVIDER=${MODEL_PROVIDER:-local} # default: local (auto-falls back here anyway if OPENAI_API_KEY is blank)
      # P1.4 — unified grounded response synthesis (off by default; A/B toggle)
      - RESPONSE_SYNTHESIS_ENABLED=${RESPONSE_SYNTHESIS_ENABLED:-false}
      # P0.1 — bearer key for /v1/chat/completions (Open WebUI). Override in prod.
      - PIPELINE_API_KEY=${PIPELINE_API_KEY:-sk-ontobot-pipeline}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_TEMPERATURE=${OPENAI_TEMPERATURE:-0.1}
      - LLM_TEMPERATURE=0.1
      # ┌─ MODE B: OpenAI Cloud ────────────────────────────────────────────┐
      # │ Set in .env: MODEL_PROVIDER=openai and OPENAI_API_KEY=sk-...     │
      # └─────────────────────────────────────────────────────────────────┘
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434} # native host Ollama (default port)
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gpt-oss:20b}
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_GPU_LAYERS=-1
      # ┌─ MODE C: Cloud Ollama (API) ───────────────────────────────────────┐
      # │ To activate: set MODEL_PROVIDER=cloud in .env                   │
      # └─────────────────────────────────────────────────────────────────┘
      - OLLAMA_CLOUD_API_KEY=${OLLAMA_CLOUD_API_KEY}
      - OLLAMA_CLOUD_BASE_URL=${OLLAMA_CLOUD_BASE_URL:-https://api.ollama.ai/v1}
      - OLLAMA_CLOUD_MODEL=${OLLAMA_CLOUD_MODEL:-gpt-oss:120b-cloud}
      # ── Phase 7: New Services ────────────────────────────────────────────
      # 7.2 Redis Response Cache
      - RESPONSE_CACHE_ENABLED=true
      - RESPONSE_CACHE_TTL=3600
      - RESPONSE_CACHE_FUZZY=true
      - RESPONSE_CACHE_MIN_SIMILARITY=0.85
      # 7.3 Password Security
      - ONTOSAGE_SECRET_KEY=${ONTOSAGE_SECRET_KEY:-change_me_in_production_use_32char}
      - SECRET_KEY=${ONTOSAGE_SECRET_KEY:-change_me_in_production_use_32char}
      # 7.4 Agent Memory (Qdrant)
      - AGENT_MEMORY_ENABLED=true
      - CROSS_SESSION_MEMORY_ENABLED=true
      - QDRANT_URL=http://qdrant:6333
      - AGENT_MEMORY_TOP_K=5
      - AGENT_MEMORY_MAX=200
      - AGENT_MEMORY_EMBED_MODEL=text-embedding-3-large
      # 7.5 WebSocket Streaming
      - ENABLE_WEBSOCKET_SUPPORT=true
      # 7.6 i18n (Multi-language)
      - I18N_ENABLED=true
      - I18N_DETECT_CONFIDENCE=0.85
      # 7.7 Ontology Auto-Detection
      - ONTOLOGY_DETECT_THRESHOLD=0.75
      # ── Capability Semantic Routing (2026-05-21) ─────────────────────────────
      # Controls which embedding provider backs the capability KB indexer and
      # query-time semantic router.  Defaults to 'openai' when MODEL_PROVIDER=openai.
      # Switch to 'local' for fully-offline operation (sentence-transformers MiniLM).
      # NOTE: changing provider triggers automatic Qdrant collection rebuild on next boot.
      - EMBEDDING_PROVIDER=${EMBEDDING_PROVIDER:-openai}
      - EMBEDDING_MODEL_OPENAI=${EMBEDDING_MODEL_OPENAI:-text-embedding-3-small}
      - EMBEDDING_MODEL_LOCAL=${EMBEDDING_MODEL_LOCAL:-sentence-transformers/all-MiniLM-L6-v2}
      - EMBEDDING_CACHE_TTL_SECONDS=${EMBEDDING_CACHE_TTL_SECONDS:-86400}
      # Analytics & RBAC
      - RBAC_ENABLED=${RBAC_ENABLED:-true}
      - BUILDING_CONFIG_FILE=/app/input/building_config.yaml
      # ── Phase improvements: new settings ────────────────────────────────
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - EXPORTS_DIR=/app/outputs/exports
      - SENSOR_MAP_PATH=/app/input/.sensor_map.cache.json # per-building cache, auto-regenerated from the live graph on boot
      - OUTPUT_DATA_DIR=/app/outputs/data
      - QUERY_RESULTS_DIR=/app/outputs/query_results
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-60}
      - RATE_LIMIT_WINDOW_S=${RATE_LIMIT_WINDOW_S:-60}
      - PLANNER_MAX_STEPS=${PLANNER_MAX_STEPS:-6}
      # STATIC_BASE_URL: base URL for floor plan PDF/PNG links embedded in chat responses.
      # ⚠️  Must point to the Nginx file-server (port 8080), NOT the orchestrator (port 8000).
      # For local dev:        http://localhost:8080
      # For public deployment: https://talk2futurebuildings.systems
      - STATIC_BASE_URL=${STATIC_BASE_URL:-http://localhost:8080}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      graphdb-rag-service:
        condition: service_started
      code-executor:
        condition: service_healthy
      graphdb:
        condition: service_started
      postgres-user-data:
        condition: service_healthy
      # mysql dependency removed: using host MySQL on port 3306 directly
    networks:
      - ontobot-agentic
      - executor-internal # reach the isolated code-executor (internal-only net)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # ====================== Vector Database (Required for graphdbRAG service) ======================
  # NOTE: Uncomment this service if using GraphDB RAG approach (rag-service)
  # Comment it out if using only Microsoft GraphRAG (graphrag-service)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-vector-db
    ports:
      - "127.0.0.1:6333:6333" # HTTP API (localhost-only; internal service)
      - "127.0.0.1:6334:6334" # gRPC (localhost-only; internal service)
    volumes:
      - ./volumes/${BUILDING_ID:?BUILDING_ID missing - set it in .env}/qdrant:/qdrant/storage # Persistent storage - all vector data preserved
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__LOG_LEVEL=INFO
    networks:
      - ontobot-agentic
    healthcheck:
      # Qdrant image has no curl/wget; use bash TCP check on HTTP port
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/localhost/6333' 2>/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped

  # ====================== Memory Store ======================
  redis:
    image: redis:7-alpine
    container_name: redis-memory-store
    ports:
      - "127.0.0.1:6379:6379" # localhost-only; internal cache/session store
    volumes:
      - ./volumes/${BUILDING_ID:?BUILDING_ID missing - set it in .env}/redis:/data
    command: >
      redis-server --appendonly yes --appendfsync everysec --save 900 1 --save
      300 10 --save 60 10000 --maxmemory 2gb --maxmemory-policy allkeys-lru --hz
      20
    networks:
      - ontobot-agentic
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # ====================== RAG Service (GraphDB + Qdrant + Similarity Indexing) ======================
  # Architecture: GraphDB for structured queries + Qdrant for vector embeddings + Similarity indexing
  # Port: 8001
  # Use this for: Traditional RAG with ontology reasoning + vector similarity search
  graphdb-rag-service:
    build:
      context: .
      dockerfile: rag-service/graphdbRAG/Dockerfile
      # Build provenance (see orchestrator above for the build command).
      args:
        GIT_SHA: "${GIT_SHA:-unknown}"
        BUILD_TIME: "${BUILD_TIME:-unknown}"
    container_name: rag-service-graphdb
    ports:
      - "127.0.0.1:8001:8001" # localhost-only; internal RAG service (reached over compose network)
    env_file:
      - .env
    environment:
      # GraphDB configuration
      - GRAPHDB_REPOSITORY=bldg
      - GRAPHDB_SIMILARITY_INDEX=bldg_index
    volumes:
      - ./data/bldg1:/staging:ro # Mount ontology files for reference
      - ./input:/app/input:ro # Mount input folder for auto-import
    depends_on:
      graphdb:
        condition: service_started # Wait for GraphDB to be ready
      # qdrant:
      #   condition: service_healthy
    networks:
      ontobot-agentic:
        aliases:
          - rag-service # Network alias for backward compatibility
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s # Give RAG service time to initialize
    restart: unless-stopped

  # ====================== RAG Service - Alternative: Microsoft GraphRAG (Entity-Relationship-Community) ======================
  # Architecture: Entity extraction + Relationship mapping + Community detection from text
  # Port: 8004
  # Use this for: Unstructured text processing with automatic knowledge graph generation
  # NOTE: Uncomment this service and comment out the above rag-service to use GraphRAG instead
  # graphrag-service:
  #   build:
  #     context: .
  #     dockerfile: rag-service/GraphRAG/Dockerfile
  #   container_name: graphrag-service
  #   ports:
  #     - "8004:8004"
  #   env_file:
  #     - .env
  #   environment:
  #     - OPENAI_API_KEY=${OPENAI_API_KEY}
  #     - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo-preview}
  #     - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
  #     - GRAPHRAG_SERVICE_PORT=8004
  #     - GRAPHRAG_INPUT_DIR=/app/graphrag-service/inputs
  #     - GRAPHRAG_OUTPUT_DIR=/app/graphrag-service/outputs
  #     - GRAPHRAG_CACHE_DIR=/app/graphrag-service/cache
  #     - LOG_LEVEL=${LOG_LEVEL:-INFO}
  #   volumes:
  #     - ./rag-service/GraphRAG/inputs:/app/graphrag-service/inputs
  #     - ./rag-service/GraphRAG/outputs:/app/graphrag-service/outputs
  #     - ./rag-service/GraphRAG/cache:/app/graphrag-service/cache
  #     - ./rag-service/GraphRAG/config:/app/graphrag-service/config:ro
  #   networks:
  #     - ontobot-agentic
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 60s
  #   restart: unless-stopped
  #   depends_on:
  #     - redis

  # ====================== Code Executor Service ======================
  code-executor:
    build:
      context: .
      dockerfile: code-executor/Dockerfile
    container_name: code-executor
    ports:
      - "127.0.0.1:8002:8002" # localhost-only; sandboxed code executor (RCE surface — never expose)
    env_file:
      - .env
    environment:
      # SECURITY: this service runs LLM-generated user code and MUST be treated as
      # an RCE surface — the in-process Python restriction is not a hard boundary.
      # It computes on request data only (no DB/LLM calls), so it needs NO secrets.
      # These blank values OVERRIDE the .env above (Compose: environment > env_file),
      # so an escape can no longer read real credentials from os.environ. The .env
      # file itself is left untouched. validate_config() is not invoked by this
      # service, so blanking provider keys does not trip startup validation.
      - OPENAI_API_KEY=
      - OLLAMA_CLOUD_API_KEY=
      - TAVILY_API_KEY=
      - GRAPHDB_PASSWORD=
      - POSTGRES_USER_PASSWORD=
      - MYSQL_PASSWORD=
      - ADMIN_PASSWORD=
      - PIPELINE_API_KEY=
      - SECRET_KEY=executor-holds-no-secrets
      # read_only rootfs support: point matplotlib/fontconfig/pyc at writable tmpfs.
      - MPLCONFIGDIR=/tmp/matplotlib
      - XDG_CACHE_HOME=/tmp/cache
      - HOME=/tmp
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./outputs:/app/outputs # Mount shared outputs
    mem_limit: 2g
    cpus: 2.0
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL # pure-compute service needs zero Linux capabilities
    read_only: true # immutable rootfs — only the tmpfs mounts + the outputs volume are writable
    tmpfs:
      - /tmp # matplotlib cache / scratch (see MPLCONFIGDIR/HOME/XDG_CACHE_HOME above)
    networks:
      - executor-internal # internal-only net: an escaped payload cannot reach host MySQL or the internet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    # ====================== Whisper STT ======================
    # whisper-stt:
    #   image: lscr.io/linuxserver/faster-whisper:latest
    #   container_name: whisper-stt-service
