  #     interval: 30s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 30s
  #   restart: unless-stopped

  # ====================== Dummy Data Publisher ======================
  # NOTE: This service publishes dummy sensor data to MySQL.
  # With host MySQL mode, it connects via host.docker.internal:3306.
  # To re-enable mysql container mode: uncomment mysql service and restore depends_on below.
  data-publisher:
    build:
      context: ./mysql-dummy-publish-dev
      dockerfile: Dockerfile
    container_name: data-publisher
    environment:
      - MYSQL_HOST=host.docker.internal # ← host MySQL (was: mysql-bldg1)
      # - MYSQL_HOST=mysql-bldg1         # ← uncomment for containerised MySQL
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-mysql}
      - MYSQL_DB=${MYSQL_DATABASE:-sensordb}
      - MYSQL_TABLE=sensor_data
      - PUBLISH_INTERVAL=30
    volumes:
      # Read-only: the publisher reads input/bldg1_timeseries_extension_uuids.json
      # to also publish live rows into the narrow per-modality tables.
      - ./input:/app/input:ro
    # depends_on:          # ← uncomment if using mysql container
    #   mysql:
    #     condition: service_healthy
    networks:
      - ontobot-agentic
    restart: unless-stopped

  # ============ Demo external DB (admin-console connect-flow rehearsal) ==========
  # A throwaway MySQL an admin connects to via the Databases tab to practise the
  # full external-DB flow. PROFILE-GATED: only runs with `docker compose --profile
  # demo up -d demo-mysql`. Never part of a normal/prod stack. Seeded on first boot
  # from config-panel/demo-db/demo_seed.sql (narrow table `demo_readings`, 2 fixed
  # UUIDs). The console's "Load demo database" button prefills a connection to it.
  demo-mysql:
    image: mysql:8
    container_name: ontosage-demo-mysql
    profiles: ["demo"]
    environment:
      - MYSQL_ROOT_PASSWORD=demo-root
      - MYSQL_DATABASE=demodb
      - MYSQL_USER=demo
      - MYSQL_PASSWORD=demo
    ports:
      - "127.0.0.1:3399:3306" # host access for debugging only (localhost-bound)
    volumes:
      - ./config-panel/demo-db/demo_seed.sql:/docker-entrypoint-initdb.d/demo_seed.sql:ro
    networks:
      - ontobot-agentic
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-pdemo-root",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

