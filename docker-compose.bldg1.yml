    ports:
      - "127.0.0.1:5433:5432" # localhost-only; 5433 on host to avoid conflict with ThingsBoard
    volumes:
      - ./volumes/${BUILDING_ID:?BUILDING_ID missing - set it in .env}/postgres-user-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_USER_DB:-ontobot}
      - POSTGRES_USER=${POSTGRES_USER_USER:-ontobot}
      - POSTGRES_PASSWORD=${POSTGRES_USER_PASSWORD:-ontobot_secret}
    networks:
      - ontobot-agentic
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontobot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

