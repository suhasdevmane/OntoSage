# Required per-space sensor modalities for the SATURATE coverage audit (V4-T06).
#
# The modality set is CONFIG, NOT CODE (2026-08-13 decision): any QA family that
# demands a new modality is a new entry here (+ a narrow table via the saturation
# pipeline), never a code change. Per-building overlay: drop a file with the same
# name into the building's input folder (nested input/<id>/ or flat input/) —
# entries there replace same-named entries here; extra entries are added.
#
# Fields per modality:
#   brick_classes:  Brick class LOCAL NAMES a sensor may be typed with (matched
#                   case-insensitively on the class IRI's local name).
#   label_contains: optional lowercase substrings — at least one must appear in
#                   the sensor's local name or rdfs:label. Used to split
#                   modalities that share a Brick class (door vs window contact).
#   sat:            how the SATURATE provisioner (V4-T08) fills a gap in this
#                   modality: the Brick class for generated sensors, the narrow
#                   MySQL table (= database_registry.yaml key = ref:storedAt local
#                   name), and the unit label carried into the sensor's rdfs:label.
#   anchors:        OPTIONAL per-building scoring band {lo, hi, citation}, set in
#                   the building's OVERLAY (not here). The deliberative scorer
#                   normalises readings against physical standards in standard
#                   units - CO2 in ppm, noise in dB(A). Hardware that publishes
#                   another scale (e.g. a CO2 air-quality INDEX around 60-90)
#                   then sits entirely outside the band, every room scores a
#                   perfect 1.0, and the ranking degenerates (CAVEAT-162).
#                   Declare the real band next to the unit it belongs to:
#
#                     modalities:
#                       co2:
#                         anchors: {lo: 60, hi: 95, citation: "index scale, datasheet"}
#
#                   Only named modalities are overridden; the rest keep their
#                   standard band and citation. An inverted, incomplete or
#                   non-numeric block is logged and IGNORED - a bad calibration
#                   must not silently replace a good standard.
modalities:
  temperature:
    brick_classes:
      - Zone_Air_Temperature_Sensor
      - Air_Temperature_Sensor
      - Temperature_Sensor
    sat:
      brick_class: Zone_Air_Temperature_Sensor
      table: temperature_data
      unit: degC
  humidity:
    brick_classes:
      - Relative_Humidity_Sensor
      - Humidity_Sensor
    sat:
      brick_class: Relative_Humidity_Sensor
      table: humidity_data
      unit: percent
  co2:
    brick_classes:
      - CO2_Level_Sensor
      - CO2_Sensor
    sat:
      brick_class: CO2_Level_Sensor
      table: co2_data
      unit: ppm
  occupancy:
    # People_Count_Sensor WAS listed here and is declared in neither Brick 1.4 nor OCBV
    # (BUG-676, checked 2026-09-17: zero owl:Class declarations in input/Brick_v1.4.ttl,
    # ontology/ontosage_schema.ttl and the live brick and bldg repositories; zero instances
    # in the active building; no committed building TTL uses it). Brick's nearest name,
    # People_Count_Sensor_Equipment, is EQUIPMENT, not a reading. The real reading class,
    # Occupancy_Count_Sensor (257 points there), is already the first entry. Removing the
    # name changed no point's membership of any modality.
    brick_classes:
      - Occupancy_Count_Sensor
      - Occupancy_Sensor
      - Motion_Sensor
    sat:
      brick_class: Occupancy_Count_Sensor
      table: occupancy_data
      unit: persons
  noise:
    # Matching stays on the LOCAL name, so both the legacy brick:-namespaced
    # instances and newly minted ontosage: ones are found by these entries.
    brick_classes:
      - Sound_Level_Sensor
      - Noise_Level_Sensor
    sat:
      # Explicitly prefixed: the pinned Brick version defines no acoustic sensor
      # class, so minting `brick:Sound_Level_Sensor` invented a term in Brick's
      # namespace (BUG-179). The class is declared in ontology/ontosage_schema.ttl.
      brick_class: ontosage:Sound_Level_Sensor
      table: noise_data
      unit: dB
  illuminance:
    brick_classes:
      - Illuminance_Sensor
      - Luminance_Sensor
    sat:
      brick_class: Illuminance_Sensor
      table: light_data
      unit: lux
  door_contact:
    brick_classes:
      - Contact_Sensor
      - Open_Close_Status
    label_contains:
      - door
    sat:
      brick_class: Contact_Sensor
      table: contact_data
      unit: binary
  window_contact:
    brick_classes:
      - Contact_Sensor
      - Open_Close_Status
    label_contains:
      - window
    sat:
      brick_class: Contact_Sensor
      table: contact_data
      unit: binary
  # ── V5-T09 expansion ────────────────────────────────────────────────────────
  # pm25 is per-room like the V4 set. The scoped entries below use sat.scope:
  #   floor    → one sensor per floor  (anchor = the floor entity)
  #   building → one sensor            (anchor = the building entity)
  # Scoped modalities are EXCLUDED from the per-room coverage matrix; the audit
  # reports their presence separately.
  pm25:
    brick_classes:
      - PM2.5_Level_Sensor
      - PM2.5_Sensor
      - Particulate_Matter_Sensor
    # Particulate_Matter_Sensor is the PARENT of PM1, PM2.5 and PM10, and on this
    # building the TVOC sensors carry it too (a source-TTL defect: a volatile
    # organic compound is not particulate matter). Four different quantities, one
    # class, so class alone cannot say which one a sensor measures -- and without
    # this list the audit picked whichever candidate came back first. Measured
    # live 2026-08-25: the pm25 sensor chosen for room 5.01 was
    # PM10_Level_Sensor_Atmospheric_5.01, i.e. a PM10 reading answering a PM2.5
    # question, against a different exposure limit. Excluding the siblings leaves
    # the 35 genuine PM2.5 sensors; PM1/PM10/TVOC stay in the graph and stay
    # queryable under their OWN classes, they simply stop impersonating this one.
    label_excludes:
      - pm10
      - pm1_
      - tvoc
    sat:
      brick_class: PM2.5_Level_Sensor
      table: pm25_data
      unit: ug/m3
  energy_submeter:
    brick_classes:
      - Electrical_Meter
      - Energy_Sensor
    sat:
      brick_class: Electrical_Meter
      table: submeter_data
      unit: kWh
      scope: floor
  # V6-T44 -- water split three ways, not two.
  #
  # The obvious split is hot/cold, and Brick 1.4 does not support it: there are
  # Hot_Water_* and Chilled_Water_* sensor classes, but NO class meaning domestic cold
  # water. Declaring a generic Water_Meter to be "cold" would assert something about what
  # that meter measures that nothing in the graph supports -- a small fabrication, but the
  # kind design contract 4 exists to forbid. So the generic meter stays generic (mains or
  # unsplit), and only the two streams Brick can actually name are split out. A building
  # that genuinely submeters cold water separately says so by typing that meter, not by
  # this file guessing.
  water_flow:
    brick_classes:
      - Water_Meter
      - Water_Flow_Sensor
    sat:
      brick_class: Water_Meter
      table: waterflow_data
      unit: L
      scope: floor
  water_flow_hot:
    brick_classes:
      - Hot_Water_Meter
      - Hot_Water_Flow_Sensor
    sat:
      brick_class: Hot_Water_Meter
      table: waterflow_data
      unit: L
      scope: floor
  water_flow_chilled:
    brick_classes:
      - Chilled_Water_Meter
      - Chilled_Water_Flow_Sensor
    sat:
      brick_class: Chilled_Water_Meter
      table: waterflow_data
      unit: L
      scope: floor
  # ── V6: modalities needed to link points the enrichment TTLs described but never
  # connected to a time series. Each Brick class was verified present in
  # input/Brick+extensions.ttl; each table already exists in the schema.
  electric_power:
    brick_classes:
      - Electric_Power_Sensor
      - Active_Power_Sensor
      - Power_Sensor
    sat:
      brick_class: Electric_Power_Sensor
      table: submeter_data
      unit: kW
      # PER FLOOR, not per building (2026-09-16). One building-wide power point left
      # "how much power is floor 3 drawing?" unanswerable while energy_submeter already
      # reported energy per floor — the same question in two units, answerable in one of
      # them. Floor-scoped matches how the building meters its energy.
      scope: floor
  motion:
    brick_classes:
      - Motion_Sensor
      - PIR_Sensor
    sat:
      brick_class: Motion_Sensor
      table: occupancy_data
      unit: binary
      scope: room
  occupancy_status:
    brick_classes:
      - Occupancy_Status
    # A lift car reports idle/travelling/door-open and is typed Occupancy_Status for
    # that reason — but it is not a room's occupancy, and counting it as one puts a
    # lift's door state into a space's coverage. This is the CAVEAT-207 split: one
    # Brick class, two populations, separated by label rather than by class because
    # the class genuinely applies to both. lift_state claims the other side.
    label_excludes:
      - lift
      - elevator
    sat:
      brick_class: Occupancy_Status
      table: occupancy_data
      unit: binary
      scope: room
  position:
    brick_classes:
      - Position_Sensor
    sat:
      brick_class: Position_Sensor
      table: equipment_data
      unit: percent
      scope: building
  water_level:
    brick_classes:
      - Water_Level_Sensor
    sat:
      brick_class: Water_Level_Sensor
      table: water_data
      unit: percent
      # Per floor (2026-09-16): a level was recorded on four of the six floors, so the same
      # question answered on some and not others with nothing to say why.
      scope: floor
  water_usage:
    brick_classes:
      - Water_Usage_Sensor
    sat:
      brick_class: Water_Usage_Sensor
      table: waterflow_data
      unit: L
      scope: building
  solar_irradiance:
    brick_classes:
      - Solar_Irradiance_Sensor
    sat:
      brick_class: Solar_Irradiance_Sensor
      table: equipment_data
      unit: W/m2
      scope: building
  runtime_hours:
    brick_classes:
      - Duration_Sensor
    sat:
      brick_class: Duration_Sensor
      table: equipment_data
      unit: hours
      scope: building
  # Air_Quality_Sensor is the generic class, so it routes to the generic IAQ table rather
  # than to co2_data. Some instances measure CO2 and one measures NO2; asserting them all as
  # CO2 because most are would be a claim the graph does not support.
  air_quality:
    brick_classes:
      - Air_Quality_Sensor
    sat:
      brick_class: Air_Quality_Sensor
      table: iaq_data
      unit: index
      scope: room
  soil_moisture:
    # BARE local name, not `ontosage:Soil_Moisture_Sensor` (BUG-676, 2026-09-17). brick_classes
    # are compared to a point's class LOCAL name (coverage_audit.ModalitySpec.matches) and
    # appended to "#" (modality_repair.build_modality_query), so the prefixed form could never
    # match: measured 2026-09-17, this modality held 0 points before and 1 after (the active
    # building's one soil-moisture point, which has a timeseries reference). The class is
    # declared in OCBV; sat.brick_class keeps the prefix because that field is what the
    # provisioner MINTS (BUG-179).
    brick_classes:
      - Soil_Moisture_Sensor
    sat:
      brick_class: ontosage:Soil_Moisture_Sensor
      table: iaq_data
      unit: percent
      scope: building
  rainfall:
    # Bare local name for the same reason as soil_moisture above (BUG-676): the prefixed
    # form matched nothing, including the active building's one rainfall point.
    brick_classes:
      - Rainfall_Sensor
    sat:
      brick_class: ontosage:Rainfall_Sensor
      table: iaq_data
      unit: mm
      scope: building
  lighting_cct:
    brick_classes:
      - Lighting_Correlated_Color_Temperature_Sensor
    sat:
      brick_class: Lighting_Correlated_Color_Temperature_Sensor
      table: equipment_data
      unit: K
      scope: room
  parking_free:
    # Parking_Occupancy_Sensor is declared in the OCBV schema (ontosage:), NOT in
    # Brick — Brick has no class for a bay count, and brick:Occupancy_Count_Sensor
    # also covers entrance footfall and room people-counters. On this building that
    # one class held 257 sensors of which exactly one was parking, so the concept
    # could not resolve to it and the bay count was unreachable. Declaring the
    # specific class makes the CLASS the discriminator; label_contains stays as the
    # fallback for a building that only types the generic parent.
    brick_classes:
      - Parking_Occupancy_Sensor
      - Occupancy_Count_Sensor
    label_contains:
      - parking
    sat:
      brick_class: ontosage:Parking_Occupancy_Sensor
      table: parking_data
      unit: bays
      scope: building
  # ── V5-T10 expansion ────────────────────────────────────────────────────────
  lift_state:
    # brick:Availability_Status is a real Brick class (verified against the loaded
    # TBox), but it is generic, so the label filter is what makes it lift-specific
    # — the same split used for door vs window contact.
    # brick:Elevator_Status WAS listed here and DOES NOT EXIST in the loaded Brick TBox
    # (checked 2026-09-17 against both the brick and bldg repositories: zero owl:Class
    # declarations, zero instances). A declared class that cannot match anything is worse
    # than an absent one — it makes the modality look like it covers lifts while it
    # resolves to nothing, which is exactly what happened: lift_state matched ZERO points
    # until Lift_1_Status_Sensor was additively typed brick:Availability_Status.
    # Occupancy_Status is deliberately NOT added here; the point carries both classes and
    # this modality claims the availability side, occupancy_status the other.
    brick_classes:
      - Availability_Status
    label_contains:
      - lift
      - elevator
    sat:
      brick_class: Availability_Status
      table: lift_data
      unit: binary
      scope: building
  # ── V6-T43: waste as a measurable domain ────────────────────────────────────
  # Verified completely absent before this was added: grepping orchestrator/,
  # shared/, config/, ontology/ and scripts/ for recycl|waste_|bin_fill|WasteBin
  # returned only an unrelated hbco:energy_waste concept — and, tellingly,
  # scripts/ttl_gap_audit.py had already recorded this exact gap as backlog item
  # P4. It is the largest wholly-missing domain the category sweep found.
  #
  # Two modalities rather than one because they answer different questions and
  # fail differently: fill level says "is this bin full NOW" (an operational
  # question with a live answer), weight says "how much did we throw away"
  # (a reporting question that needs history). A single "waste" modality would
  # force one to stand in for the other.
  #
  # PROVISIONED 2026-09-17 (BUG-649), after a day of resolving to ZERO points while this
  # entry read as though the domain were handled. DECLARING A MODALITY IS NOT COVERING A
  # DOMAIN — the entry above records that the gap was FOUND, and for as long as nothing
  # closed it a reader skimming this file would have concluded otherwise.
  #
  # Now: a general-waste and a mixed-recycling bin on every floor, each with BOTH a fill
  # level and a weight, in that floor's own kitchen / break room / common area. Fill answers
  # "does this need emptying", weight answers "how much did we throw away", and neither
  # stands in for the other. Written by scripts/provision_damper_and_waste_points.py, which
  # discovers the rooms rather than naming them, so it runs for another building unchanged.
  #
  # The publisher treats a bin as a SAWTOOTH, not a walk: it accumulates while the building
  # is occupied and drops to near-empty on collection, and weight follows fill through that
  # stream's own capacity (general waste is denser than mixed dry recycling, so one constant
  # would make every recycling weight wrong). tests/test_a_bin_fills_and_is_emptied.py.
  waste_fill:
    # Matching stays on the LOCAL name so both minted ontosage: instances and any
    # legacy brick:-namespaced ones are found.
    #
    # Level_Sensor and Fill_Level_Sensor WERE listed here and neither exists (BUG-676, checked
    # 2026-09-17): no owl:Class declaration in input/Brick_v1.4.ttl, OCBV, or the live brick
    # and bldg repositories, zero instances in the active building, and no committed building
    # TTL uses either. Brick 1.4 has only substance-specific level sensors (Water_Level_Sensor,
    # CO2_Level_...) and a Level_Status point, none of which means how full a bin is. All 12
    # bin-fill points are ontosage:Waste_Fill_Sensor, so removing both changed no membership.
    brick_classes:
      - Waste_Fill_Sensor
    label_contains:
      - waste
      - bin
      - recycl
    sat:
      # Explicitly prefixed: the pinned Brick version defines NO level or weight
      # sensor class, so an unprefixed name would mint a term into Brick's own
      # namespace (BUG-179). Verified against the loaded TBox before writing this.
      brick_class: ontosage:Waste_Fill_Sensor
      table: wastefill_data
      unit: percent
      scope: room
  waste_weight:
    # Weight_Sensor WAS listed here and does not exist (BUG-676, checked 2026-09-17): no
    # owl:Class in Brick 1.4, OCBV or the live repositories, zero instances in the active
    # building, no committed building TTL uses it. Brick 1.4 defines no mass or weight sensor.
    # All 12 bin-weight points are ontosage:Waste_Weight_Sensor, so removing it changed no
    # membership.
    brick_classes:
      - Waste_Weight_Sensor
    label_contains:
      - waste
      - bin
      - recycl
    sat:
      brick_class: ontosage:Waste_Weight_Sensor
      table: wasteweight_data
      unit: kg
      scope: room

  # ── Plant / BMS state (V6-T26, Master Package D) ──────────────────────────
  # The Master Report is explicit that the hundreds of points a BMS already holds should be
  # INTEGRATED, not duplicated with new IoT sensors: duplication costs more and produces a
  # second, less authoritative copy of the same measurement.
  #
  # So plant state is declared exactly like any other modality. A point typed with one of
  # these Brick classes and carrying ref:hasTimeseriesId + ref:storedAt is answerable through
  # the normal lanes with no code change — which is the whole portability claim, applied to
  # the one source family that most often lives outside the sensor estate.
  #
  # Every class below was verified present in the loaded Brick TBox before being written
  # here; none needs an ontosage: prefix (contrast waste_fill above, and BUG-179).
  #
  # `scope: equipment` — these describe PLANT, not a room. Grading them against room coverage
  # would report a false gap: an AHU serving thirty rooms is one point, not thirty.
  supply_air_temperature:
    brick_classes:
      - Supply_Air_Temperature_Sensor
      - Discharge_Air_Temperature_Sensor
    sat:
      brick_class: Supply_Air_Temperature_Sensor
      table: plant_data
      unit: degC
      scope: equipment
  return_air_temperature:
    brick_classes:
      - Return_Air_Temperature_Sensor
      - Mixed_Air_Temperature_Sensor
    sat:
      brick_class: Return_Air_Temperature_Sensor
      table: plant_data
      unit: degC
      scope: equipment
  fan_state:
    brick_classes:
      - Fan_Status
      - Start_Stop_Status
    sat:
      brick_class: Fan_Status
      table: plant_data
      unit: binary
      scope: equipment
  leaving_water_temperature:
    # The flow side of a generator's circuit. With entering_water_temperature below it makes
    # the delta-T across a heating or chilled circuit answerable — the question a plant
    # engineer asks first, and the one this estate could not answer at all (CAVEAT-603).
    lay_terms: [flow temperature, leaving water temperature, circuit flow, heating flow]
    brick_classes:
      - Leaving_Water_Temperature_Sensor
    sat:
      brick_class: Leaving_Water_Temperature_Sensor
      table: plant_data
      unit: degC
      scope: equipment

  entering_water_temperature:
    lay_terms: [return temperature, entering water temperature, circuit return, heating return]
    brick_classes:
      - Entering_Water_Temperature_Sensor
    sat:
      brick_class: Entering_Water_Temperature_Sensor
      table: plant_data
      unit: degC
      scope: equipment

  damper_position:
    brick_classes:
      - Damper_Position_Sensor
      - Damper_Position_Command
    sat:
      brick_class: Damper_Position_Sensor
      table: plant_data
      unit: percent
      scope: equipment
  filter_differential_pressure:
    brick_classes:
      - Filter_Differential_Pressure_Sensor
      - Differential_Pressure_Sensor
    label_contains:
      - filter
    sat:
      brick_class: Filter_Differential_Pressure_Sensor
      table: plant_data
      unit: pa
      scope: equipment
  supply_air_flow:
    brick_classes:
      - Supply_Air_Flow_Sensor
      - Air_Flow_Sensor
    sat:
      brick_class: Air_Flow_Sensor
      table: plant_data
      unit: m3h
      scope: equipment
  # ── The gases the building could only answer for on one floor ────────────────
  #
  # Measured 2026-09-16 from the graph's own topology (sensor -> space -> floor,
  # not parsed out of sensor names): CO, NO2, PM1, PM10, formaldehyde and TVOC
  # existed ONLY on the floor carrying the real instrumentation snapshot. So
  # "what is the NO2 on floor 2?" answered honestly that there was no data while
  # the same question about floor 5 answered with a figure -- an asymmetry the
  # user cannot see and has no way to predict.
  #
  # scope: floor, deliberately. Per room these six would add ~1,400 points, which
  # slows every query for no gain in what can be answered; one node per floor is
  # also how a multi-gas IAQ unit is actually deployed -- and how the existing
  # dense floor models it, as a single "installed-node" per room carrying every
  # gas at once. The dense floor keeps its per-room detail; the rest of the
  # building gains a floor-level reading that is honest about being one.
  #
  # Units and bands are NOT invented here: each matches the measurand's declared
  # physicalUnit in ontology/measurand_kinds.ttl (BUG-609 -- a reading judged
  # against another quantity's band is reported as physically impossible).
  carbon_monoxide:
    brick_classes:
      - CO_Level_Sensor
      - CO_Sensor
    sat:
      brick_class: CO_Level_Sensor
      table: iaq_data
      unit: ppm
      scope: floor
  nitrogen_dioxide:
    brick_classes:
      - NO2_Level_Sensor
    sat:
      brick_class: NO2_Level_Sensor
      table: iaq_data
      unit: ppb
      scope: floor
  formaldehyde:
    brick_classes:
      - Formaldehyde_Level_Sensor
    sat:
      brick_class: Formaldehyde_Level_Sensor
      table: iaq_data
      unit: ppb
      scope: floor
  tvoc:
    brick_classes:
      - TVOC_Level_Sensor
      - TVOC_Sensor
    sat:
      brick_class: TVOC_Level_Sensor
      table: iaq_data
      unit: ppb
      scope: floor
  pm10:
    brick_classes:
      - PM10_Level_Sensor
      - PM10_Sensor
    label_excludes:
      - pm1_
      - pm2
    sat:
      brick_class: PM10_Level_Sensor
      table: iaq_data
      unit: ug/m3
      scope: floor
  pm1:
    brick_classes:
      - PM1_Level_Sensor
      - PM1_Sensor
    label_excludes:
      - pm10
      - pm2
    sat:
      brick_class: PM1_Level_Sensor
      table: iaq_data
      unit: ug/m3
      scope: floor
  # Multi-gas detection was present on one floor only. Same reasoning as the six gases
  # above: a question about combustible gas on floor 2 could not be answered while the
  # same question about floor 5 could, and nothing in either answer said why.
  gas:
    brick_classes:
      - Gas_Sensor
    sat:
      brick_class: Gas_Sensor
      table: iaq_data
      unit: ppm
      scope: floor
  # Flow RATE per floor. water_flow above records VOLUME through a meter (WaterVolume);
  # this is the rate a floor is drawing (WaterFlow), which existed on two floors only.
  water_flow_rate:
    brick_classes:
      - Water_Flow_Sensor
    sat:
      brick_class: Water_Flow_Sensor
      table: waterflow_data
      unit: L/s
      scope: floor
