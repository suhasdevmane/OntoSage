# Entity enrichment config (Part D) — make ANY input-TTL point queryable.
#
# The enricher (services/entity_enricher.py) scans GraphDB for time-series points
# (those with ref:hasTimeseriesId) that LACK a Brick class and/or rdfs:label, and
# DERIVES the missing class/label/relationships from the entity's URI tokens — so
# resolution always keys off class + label + relationships, never the raw URI.
#
# Example it handles:
#   bldg:bldgx.ZONE.AHU01.RM123.Zone_Air_Temp  ->
#     a brick:Zone_Air_Temperature_Sensor ;
#     rdfs:label "Zone Air Temperature — AHU01 / RM123" ;
#     brick:isPointOf bldg:AHU01 ; brick:hasLocation bldg:RM123 .
#
# This is config, not code — extend the maps for your building's naming scheme.
# Matching normalizes URI local-names: split on . _ - / and camelCase, lowercased;
# the LONGEST matching point-type token-phrase wins.

# Point-type token (or token-phrase) -> Brick point class.
# Include full names AND common BMS/Haystack abbreviations.
point_classes:
  zone_air_temp: "brick:Zone_Air_Temperature_Sensor"
  zone_air_temperature: "brick:Zone_Air_Temperature_Sensor"
  zat: "brick:Zone_Air_Temperature_Sensor"
  supply_air_temp: "brick:Supply_Air_Temperature_Sensor"
  sat: "brick:Supply_Air_Temperature_Sensor"
  return_air_temp: "brick:Return_Air_Temperature_Sensor"
  rat: "brick:Return_Air_Temperature_Sensor"
  air_temp: "brick:Air_Temperature_Sensor"
  temperature: "brick:Air_Temperature_Sensor"
  temp: "brick:Air_Temperature_Sensor"
  co2: "brick:CO2_Level_Sensor"
  humidity: "brick:Humidity_Sensor"
  rh: "brick:Humidity_Sensor"
  occupancy: "brick:Occupancy_Sensor"
  occ: "brick:Occupancy_Sensor"
  energy: "brick:Energy_Sensor"
  kwh: "brick:Energy_Sensor"
  water_flow: "brick:Water_Flow_Sensor"
  flow: "brick:Water_Flow_Sensor"
  illuminance: "brick:Illuminance_Sensor"
  lux: "brick:Illuminance_Sensor"
  pm25: "brick:PM2.5_Level_Sensor"
  voc: "brick:TVOC_Level_Sensor"
  tvoc: "brick:TVOC_Level_Sensor"
  runtime: "brick:Run_Time_Sensor"
  run_time: "brick:Run_Time_Sensor"
  pressure: "brick:Pressure_Sensor"
  noise: "bldg:Noise_Level_Sensor"
  vibration: "bldg:Vibration_Sensor"
  setpoint: "brick:Setpoint"
  sp: "brick:Setpoint"

# URI-token regex -> equipment. Match → link point via brick:isPointOf bldg:<token>
# and create a typed stub bldg:<token> a <class> so the relationship resolves.
equipment_patterns:
  - pattern: '^ahu\d+$'
    class: "brick:AHU"
  - pattern: '^vav\d+$'
    class: "brick:VAV"
  - pattern: '^fcu\d+$'
    class: "brick:FCU"
  - pattern: '^rtu\d+$'
    class: "brick:RTU"
  - pattern: '^(chiller|boiler|pump)\d*$'
    class: "brick:Equipment"

# URI-token regex -> location. Match → brick:hasLocation bldg:<token> + a stub.
location_patterns:
  - pattern: '^(rm|room|r)\d+$'
    class: "brick:Room"
  - pattern: '^(floor|fl|lvl|l)\d+$'
    class: "brick:Floor"
  - pattern: '^zone\d+$'
    class: "brick:HVAC_Zone"

# Tokens ignored when humanizing the label (building/namespace markers).
ignore_tokens:
  - bldg
  - bldgx
  - zone
