server {
    listen 80;
    server_name _;

    # BUG-1700 (2026-11-05): this server had `autoindex on` at every location, so anyone who
    # could reach it (localhost, or the public tunnel when it runs) could LIST every chart and
    # export, and every file in the building's input/ folder through /floor-plans/ — TTLs,
    # documents, registry YAML. Listing is now off everywhere, /floor-plans/ serves floor-plan
    # PDFs only, and exports carry a random token in their name. A link in an answer still
    # works for whoever holds it (a browser cannot attach a session to an <img> or download
    # link Open WebUI renders), so a link is a bearer credential: share answers accordingly.
    autoindex off;

    # Default root: the building's artifacts volume. Nothing links here; refuse rather than
    # serve whatever happens to be in it (forecast skill files, upload caches).
    root /usr/share/nginx/html;

    # Rendered floor plan PNGs: /floor-plans/renders/<building>/floor_<n>[_thumb].png
    location ~ "^/floor-plans/renders/(?<rpath>[A-Za-z0-9_-]+/[A-Za-z0-9_. -]+\.png)$" {
        alias /srv/floor-plan-renders/$rpath;
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Floor plan PDFs: /floor-plans/<label> floor <n>.pdf — from input/, PDFs ONLY. The rest of
    # input/ (TTL, YAML, documents) is not this server's to publish.
    location ~ "^/floor-plans/(?<fpname>[^/]+\.pdf)$" {
        alias /srv/floor-plan-pdfs/$fpname;
    }

    # Analytics & visualisation plots and exports: /static/<file>, /static/exports/<file>.
    # Allow cross-origin so Open WebUI can embed the images.
    location ~ "^/static/(?<spath>(exports/)?[A-Za-z0-9_.-]+\.(png|svg|csv|json|xlsx|pdf|docx|html|md|txt))$" {
        alias /srv/static/$spath;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "private, max-age=3600";
    }

    # The compose healthcheck probes "/" and accepts 200 — answer it without listing anything.
    location = / {
        default_type text/plain;
        return 200 "OntoSage file server\n";
    }

    location / {
        return 404;
    }
}
