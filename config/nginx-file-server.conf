server {
    listen 80;
    server_name _;

    # Default root for /static/ exports and other artifacts
    root /usr/share/nginx/html;
    autoindex on;

    # Rendered floor plan PNGs: /floor-plans/renders/<building>/...
    # Served from a separate (non-nested) volume mount
    location /floor-plans/renders/ {
        alias /srv/floor-plan-renders/;
        autoindex on;
    }

    # Floor plan PDFs: /floor-plans/<filename>.pdf
    # Served from the input folder (read-only)
    location /floor-plans/ {
        alias /srv/floor-plan-pdfs/;
        autoindex on;
    }

    # Analytics & visualisation plots: /static/<filename>.png
    # Served from the orchestrator's outputs folder (read-only).
    # Allow cross-origin so OpenWebUI (localhost:3000) can embed images.
    location /static/ {
        alias /srv/static/;
        autoindex on;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600";
    }

    # Everything else (artifacts, static exports)
    location / {
        try_files $uri $uri/ =404;
    }
}
