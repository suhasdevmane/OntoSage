{{- if .Values.buildingConfig.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ontosage.fullname" . }}-building-config
  labels:
    {{- include "ontosage.labels" . | nindent 4 }}
data:
  building_config.yaml: |
    {{- .Values.buildingConfig.content | nindent 4 }}
{{- end }}
---
{{- if .Values.secrets.openaiApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ontosage.fullname" . }}-secrets
  labels:
    {{- include "ontosage.labels" . | nindent 4 }}
type: Opaque
data:
  openai-api-key: {{ .Values.secrets.openaiApiKey | b64enc }}
  jwt-secret-key:  {{ .Values.secrets.jwtSecretKey | b64enc }}
{{- end }}
---
{{- if .Values.orchestrator.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ontosage.fullname" . }}
  labels:
    {{- include "ontosage.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
spec:
  ingressClassName: {{ .Values.orchestrator.ingress.className }}
  rules:
    - host: {{ .Values.orchestrator.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "ontosage.fullname" . }}-orchestrator
                port:
                  number: {{ .Values.orchestrator.service.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "ontosage.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.service.port }}
{{- end }}
