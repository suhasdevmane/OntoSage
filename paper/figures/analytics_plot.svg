<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <style>
    .axis { stroke:#333; stroke-width:2; }
    .grid { stroke:#ddd; stroke-width:1; }
    .line { fill:none; stroke:#1f77b4; stroke-width:3; }
    .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill:#2c3e50; }
    .label { font-family: Arial, sans-serif; font-size: 16px; fill:#2c3e50; }
  </style>
  <text x="30" y="40" class="title">Temperature Trend on Level 3 (Last 7 Days)</text>

  <!-- Plot area -->
  <rect x="100" y="80" width="980" height="460" fill="#fff" stroke="#ccc"/>

  <!-- Grid lines -->
  <g>
    <line x1="100" y1="520" x2="1080" y2="520" class="grid"/>
    <line x1="100" y1="460" x2="1080" y2="460" class="grid"/>
    <line x1="100" y1="400" x2="1080" y2="400" class="grid"/>
    <line x1="100" y1="340" x2="1080" y2="340" class="grid"/>
    <line x1="100" y1="280" x2="1080" y2="280" class="grid"/>
    <line x1="100" y1="220" x2="1080" y2="220" class="grid"/>
    <line x1="100" y1="160" x2="1080" y2="160" class="grid"/>
    <line x1="100" y1="100" x2="1080" y2="100" class="grid"/>
  </g>

  <!-- Axes -->
  <line x1="100" y1="80" x2="100" y2="540" class="axis"/>
  <line x1="100" y1="540" x2="1080" y2="540" class="axis"/>

  <!-- Axis labels -->
  <text x="50" y="100" class="label">30°C</text>
  <text x="50" y="160" class="label">28°C</text>
  <text x="50" y="220" class="label">26°C</text>
  <text x="50" y="280" class="label">24°C</text>
  <text x="50" y="340" class="label">22°C</text>
  <text x="50" y="400" class="label">20°C</text>
  <text x="50" y="460" class="label">18°C</text>
  <text x="50" y="520" class="label">16°C</text>

  <text x="180" y="570" class="label">Day 1</text>
  <text x="320" y="570" class="label">Day 2</text>
  <text x="460" y="570" class="label">Day 3</text>
  <text x="600" y="570" class="label">Day 4</text>
  <text x="740" y="570" class="label">Day 5</text>
  <text x="880" y="570" class="label">Day 6</text>
  <text x="1020" y="570" class="label">Day 7</text>

  <!-- Trend line (mock data) -->
  <path class="line" d="M 140 420 L 260 380 L 380 360 L 500 340 L 620 320 L 740 300 L 860 310 L 980 290" />

  <!-- Legend -->
  <rect x="900" y="100" width="260" height="80" fill="#fff" stroke="#ccc"/>
  <line x1="920" y1="140" x2="960" y2="140" class="line"/>
  <text x="970" y="146" class="label">Avg Temperature (°C)</text>
</svg>
