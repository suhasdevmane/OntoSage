<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <style>
    .box { fill:#f7f7f9; stroke:#2c3e50; stroke-width:2; }
    .title { font-family: Arial, sans-serif; font-size: 22px; font-weight: bold; fill:#2c3e50; }
    .label { font-family: Arial, sans-serif; font-size: 16px; fill:#2c3e50; }
    .arrow { stroke:#2c3e50; stroke-width:2; marker-end:url(#arrowhead); }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50" />
    </marker>
  </defs>
  <text x="30" y="40" class="title">OntoSage System Architecture</text>

  <!-- UI / Frontend -->
  <rect x="40" y="80" width="300" height="80" class="box"/>
  <text x="60" y="120" class="label">Open WebUI</text>
  
  <!-- Orchestrator -->
  <rect x="420" y="80" width="300" height="80" class="box"/>
  <text x="440" y="120" class="label">Orchestrator (LangGraph)</text>

  <!-- LLM -->
  <rect x="820" y="80" width="300" height="80" class="box"/>
  <text x="840" y="120" class="label">LLM Manager (Ollama)</text>

  <!-- RAG Service -->
  <rect x="420" y="200" width="300" height="80" class="box"/>
  <text x="440" y="240" class="label">RAG Service (GraphDB)</text>

  <!-- GraphDB -->
  <rect x="820" y="200" width="300" height="80" class="box"/>
  <text x="840" y="240" class="label">GraphDB (RDF/TTL)</text>

  <!-- MySQL -->
  <rect x="820" y="320" width="300" height="80" class="box"/>
  <text x="840" y="360" class="label">MySQL (Time-series)</text>

  <!-- Redis -->
  <rect x="820" y="440" width="300" height="80" class="box"/>
  <text x="840" y="480" class="label">Redis (Memory/Cache)</text>

  <!-- Code Executor -->
  <rect x="420" y="320" width="300" height="80" class="box"/>
  <text x="440" y="360" class="label">Code Executor (Sandbox)</text>

  <!-- Whisper STT -->
  <rect x="40" y="200" width="300" height="80" class="box"/>
  <text x="60" y="240" class="label">Whisper STT</text>

  <!-- Abacws API -->
  <rect x="40" y="320" width="300" height="80" class="box"/>
  <text x="60" y="360" class="label">Abacws API</text>

  <!-- Visualiser -->
  <rect x="40" y="440" width="300" height="80" class="box"/>
  <text x="60" y="480" class="label">Visualiser</text>

  <!-- Arrows -->
  <line x1="340" y1="120" x2="420" y2="120" class="arrow"/>
  <line x1="720" y1="120" x2="820" y2="120" class="arrow"/>

  <line x1="720" y1="240" x2="820" y2="240" class="arrow"/>
  <line x1="720" y1="360" x2="820" y2="360" class="arrow"/>
  <line x1="720" y1="480" x2="820" y2="480" class="arrow"/>

  <line x1="340" y1="240" x2="420" y2="240" class="arrow"/>
  <line x1="340" y1="360" x2="420" y2="360" class="arrow"/>
  <line x1="340" y1="480" x2="420" y2="480" class="arrow"/>

  <!-- Labels for flows -->
  <text x="360" y="100" class="label">HTTP</text>
  <text x="760" y="100" class="label">LLM prompts</text>
  <text x="760" y="220" class="label">SPARQL / Context</text>
  <text x="760" y="340" class="label">SQL Queries</text>
  <text x="760" y="460" class="label">State / Cache</text>
</svg>
