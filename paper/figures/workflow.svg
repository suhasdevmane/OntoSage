<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
  <style>
    .box { fill:#eef6ff; stroke:#1f4b99; stroke-width:2; rx:8; }
    .label { font-family: Arial, sans-serif; font-size: 16px; fill:#1f2d3d; }
    .arrow { stroke:#1f4b99; stroke-width:2; marker-end:url(#arrowhead); }
    .title { font-family: Arial, sans-serif; font-size: 20px; font-weight: bold; fill:#1f2d3d; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1f4b99" />
    </marker>
  </defs>
  <text x="20" y="30" class="title">OntoSage End-to-End Workflow</text>

  <!-- Stages -->
  <rect x="20" y="60" width="120" height="60" class="box"/>
  <text x="30" y="95" class="label">Dialogue</text>

  <rect x="180" y="60" width="120" height="60" class="box"/>
  <text x="210" y="95" class="label">RAG</text>

  <rect x="340" y="60" width="140" height="60" class="box"/>
  <text x="360" y="95" class="label">SPARQL</text>

  <rect x="520" y="60" width="160" height="60" class="box"/>
  <text x="530" y="95" class="label">UUID / Storage</text>

  <rect x="720" y="60" width="120" height="60" class="box"/>
  <text x="750" y="95" class="label">SQL</text>

  <rect x="860" y="60" width="150" height="60" class="box"/>
  <text x="870" y="95" class="label">Analytics</text>

  <rect x="1040" y="60" width="140" height="60" class="box"/>
  <text x="1050" y="95" class="label">Visualization</text>

  <!-- Response at bottom -->
  <rect x="520" y="160" width="160" height="60" class="box"/>
  <text x="560" y="195" class="label">Response</text>

  <!-- Arrows -->
  <line x1="140" y1="90" x2="180" y2="90" class="arrow"/>
  <line x1="300" y1="90" x2="340" y2="90" class="arrow"/>
  <line x1="480" y1="90" x2="520" y2="90" class="arrow"/>
  <line x1="680" y1="90" x2="720" y2="90" class="arrow"/>
  <line x1="840" y1="90" x2="860" y2="90" class="arrow"/>
  <line x1="1010" y1="90" x2="1040" y2="90" class="arrow"/>
  <line x1="1110" y1="120" x2="600" y2="160" class="arrow"/>

  <!-- Notes -->
  <text x="25" y="140" class="label">Intent, entities, time range</text>
  <text x="190" y="140" class="label">Context: prefixes, triples, IRIs</text>
  <text x="360" y="140" class="label">Metadata or UUID bindings</text>
  <text x="520" y="140" class="label">ref:hasTimeseriesId, storedAt</text>
  <text x="730" y="140" class="label">SELECT-only, unpivot</text>
  <text x="880" y="140" class="label">Pandas/seaborn, retry</text>
  <text x="1060" y="140" class="label">Charts/images</text>
</svg>
