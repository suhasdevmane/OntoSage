name: OntoSage CI/CD

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]
  schedule:
    # Nightly benchmark at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      run_benchmark:
        description: "Run RAG benchmark suite"
        required: false
        default: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  DOCKER_BUILDKIT: 1

jobs:

  # ── 1. Lint & Static Analysis ────────────────────────────────────────────
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install lint tools
        run: pip install flake8 black isort yamllint pyyaml rdflib
      - name: Black format check
        run: black --check --line-length 100 orchestrator/ shared/ scripts/ tests/
        continue-on-error: true
      - name: isort check
        run: isort --check-only --profile black orchestrator/ shared/ tests/
        continue-on-error: true
      - name: Flake8 (real-bug gate — blocking)
        # Only F821 (undefined name) and F823 (local var used before assignment)
        # are blocking. These are 100% real runtime bugs with no false positives.
        # Other F-codes (F401 unused imports, F811 redefinition, F841 unused
        # local) are noisy in this codebase and treated as advisory below.
        run: |
          flake8 orchestrator/ shared/ scripts/ \
            --select=F821,F823 \
            --per-file-ignores="__init__.py:F401"
      - name: Flake8 (style + import hygiene — non-blocking advisory)
        # Style + import-hygiene checks. continue-on-error matches the Black +
        # isort policy above (visibility without blocking the pipeline).
        # E402 is ignored because every module uses the deliberate
        # `sys.path.append('/app')` Docker import pattern at the top.
        run: |
          flake8 orchestrator/ shared/ scripts/ \
            --max-line-length 110 \
            --extend-ignore=E203,E402,E501,W503 \
            --per-file-ignores="__init__.py:F401" \
            --statistics --count --exit-zero
        continue-on-error: true
      - name: YAML lint
        run: yamllint config/ -d relaxed || true

  # ── 2. Unit Tests (Python 3.10 / 3.11 / 3.12 matrix) ───────────────────
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r orchestrator/requirements.txt \
            pytest pytest-asyncio pytest-cov pytest-timeout rdflib pyyaml httpx
      - name: Run unit tests
        # Phase 16C (2026-05-29) — expanded from a single test file to the
        # full Phase 11-16 deterministic suite.  Live e2e suites
        # (test_capability_e2e.py, test_floor_plan_e2e.py,
        # test_non_regression_intents.py, test_ontology_integrity.py)
        # are EXCLUDED from CI — they need a running orchestrator + Redis
        # + GraphDB + Qdrant and belong in a separate integration job.
        run: |
          pytest \
            tests/test_phase3_4_services.py \
            tests/test_coreference_rewrite.py \
            tests/test_blended_persona.py \
            tests/test_compound_query_e2e.py \
            tests/test_intent_graph_autowire.py \
            tests/test_multi_tenant_fixture.py \
            tests/test_routing_accuracy.py \
            tests/test_state_persistence.py \
            tests/test_swap_building.py \
            tests/test_unregistered_intent_safety_net.py \
            tests/test_workflow_wiring.py \
            tests/test_survey_aligned_phases.py \
            tests/test_phase_a_fixes.py \
            tests/services/test_ttl_validator.py \
            tests/test_turn_memory.py \
            tests/test_conversation_memory_e2e.py \
            -v --timeout=120 \
            --cov=orchestrator \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            -p no:warnings
        env:
          PYTHONPATH: ${{ github.workspace }}
          BUILDING_CONFIG_FILE: config/building_config.yaml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage-unit.xml
          flags: unit-py${{ matrix.python-version }}
          fail_ci_if_error: false
        continue-on-error: true

  # ── 3. Integration Tests (mock building) ─────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r orchestrator/requirements.txt \
            pytest pytest-asyncio pytest-cov pytest-timeout rdflib pyyaml httpx
      - name: Run integration tests
        run: |
          pytest tests/test_integration_mock_building.py \
            -v --timeout=120 \
            --cov=orchestrator \
            --cov-report=xml:coverage-integration.xml \
            -p no:warnings
        env:
          PYTHONPATH: ${{ github.workspace }}
          BUILDING_CONFIG_FILE: config/building_config.yaml
      - uses: codecov/codecov-action@v4
        with:
          file: coverage-integration.xml
          flags: integration
          fail_ci_if_error: false
        continue-on-error: true

  # ── 4. Onboarding CLI Test ─────────────────────────────────────────────
  onboarding-cli:
    name: Onboarding CLI (non-interactive)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install rdflib pyyaml
      - name: Run non-interactive onboarding
        run: |
          python scripts/onboard_building.py \
            --non-interactive \
            --id ci_test_bldg \
            --name "CI Test Building" \
            --namespace "http://ci.test.local/building#" \
            --output /tmp/ci_test_config.yaml
          python -c "import yaml; yaml.safe_load(open('/tmp/ci_test_config.yaml'))"
          echo "✅ Config valid"

  # ── 5. Multi-Building Config Validation ──────────────────────────────────
  multi-building:
    name: Multi-Building Config Validation
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install pyyaml rdflib
      - name: Validate multi-building config manager
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          try:
              from orchestrator.services.multi_building_manager import MultiBuildingConfigManager
              mgr = MultiBuildingConfigManager('config/')
              print('✅ MultiBuildingConfigManager loaded')
              print(f'  Buildings discovered: {len(mgr.list_buildings())}')
          except ImportError as e:
              print(f'Import skipped (expected in CI): {e}')
          "

  # ── 6. RAG Benchmark (mock mode) ─────────────────────────────────────────
  rag-benchmark:
    name: RAG Benchmark Suite
    runs-on: ubuntu-latest
    needs: integration-tests
    if: |
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.run_benchmark == 'true') ||
      github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install rdflib pyyaml httpx
      - name: Run RAG benchmark (mock)
        run: |
          python tests/rag_benchmark.py \
            --mock \
            --output outputs/benchmark/rag_benchmark_report.md
        env:
          PYTHONPATH: ${{ github.workspace }}
      - uses: actions/upload-artifact@v4
        with:
          name: rag-benchmark-report
          path: outputs/benchmark/
          retention-days: 30
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('outputs/benchmark/rag_benchmark_report.md', 'utf8');
            const summary = report.split('\n').slice(0, 30).join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## RAG Benchmark Results\n\n${summary}`
            });
        continue-on-error: true

  # ── 7. Docker Build Validation ────────────────────────────────────────────
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: ./orchestrator
          push: false
          tags: ontosage/orchestrator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
        continue-on-error: true

  # ── 8. Security Scan ─────────────────────────────────────────────────────
  security:
    name: Security Scan (bandit)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install bandit
      - name: Run bandit
        run: |
          bandit -r orchestrator/ shared/ \
            -ll --exclude orchestrator/tests \
            -f json -o bandit-report.json || true
          python -c "
          import json
          r = json.load(open('bandit-report.json'))
          highs = [i for i in r.get('results', []) if i['issue_severity'] == 'HIGH']
          print(f'HIGH severity issues: {len(highs)}')
          for h in highs[:5]:
              print(f'  {h[\"filename\"]}:{h[\"line_number\"]} — {h[\"issue_text\"]}')
          "
      - uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 14
        continue-on-error: true

  # ── 9. CI Summary ───────────────────────────────────────────────────────
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, onboarding-cli]
    if: always()
    steps:
      - name: Write summary
        run: |
          echo "## OntoSage CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Onboarding CLI | ${{ needs.onboarding-cli.result }} |" >> $GITHUB_STEP_SUMMARY
