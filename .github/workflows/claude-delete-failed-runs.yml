name: Claude - Delete Failed Workflow Runs

on:
  workflow_dispatch:

jobs:
  delete-failed-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete all failed workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching failed workflow runs..."
          DELETED=0
          while true; do
            IDS=$(gh run list --repo suhasdevmane/OntoSage --status failure --limit 100 --json databaseId -q '.[].databaseId')
            if [ -z "$IDS" ]; then
              echo "No more failed runs found."
              break
            fi
            for ID in $IDS; do
              echo "Deleting run ID: $ID"
              gh run delete "$ID" --repo suhasdevmane/OntoSage
              DELETED=$((DELETED + 1))
            done
          done
          echo "Done! Deleted $DELETED failed workflow run(s)."
