site_name: OntoSage 2.0
site_description: Agentic AI for Intelligent Buildings — with capability semantic routing
site_url: https://suhasdevmane.github.io/OntoSage/
repo_url: https://github.com/suhasdevmane/OntoSage
repo_name: suhasdevmane/OntoSage
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  language: en
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
  palette:
    # Auto (system preference)
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    # Light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - codehilite
  - footnotes
  - meta
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.arithmatex:
      generic: true

copyright: >
  Copyright &copy; 2026 OntoSage · Cardiff University — MIT Licensed

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/suhasdevmane/OntoSage
      name: OntoSage on GitHub
    - icon: fontawesome/solid/book
      link: https://suhasdevmane.github.io/OntoSage/
      name: Documentation

extra_css:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css
  - assets/overrides.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js
  - assets/katex-init.js
  # Mermaid is rendered natively by Material for MkDocs via the superfences
  # custom fence below — it handles instant-navigation re-rendering and the
  # light/dark palette automatically. (No manual mermaid.js script needed.)

nav:
  - Overview: index.md
  - Project Structure: PROJECT_STRUCTURE.md
  - Architecture: ARCHITECTURE.md
  - Workflow Deep Dive: WORKFLOW.md
  - Services: SERVICES.md
  - Capability Routing (v2.0): CAPABILITY_ROUTING.md
  - Conversation Intelligence: CONVERSATION_INTELLIGENCE.md
  - Forecasting: FORECASTING.md
  - Configuration: CONFIGURATION.md
  - GraphDB Setup: GRAPHDB_SETUP.md
  - Building Onboarding: BUILDING_ONBOARDING.md
  - Deployment: DEPLOYMENT.md
  - Runbook: RUNBOOK.md
  - Developer Guide: DEVELOPER_GUIDE.md
  - User Guide: USER_GUIDE.md
  - Security: SECURITY.md
  - Design Notes:
    - Plans:
      - Orchestrator Recovery: superpowers/plans/2026-03-31-orchestrator-recovery.md
      - Claude Config Setup: superpowers/plans/2026-04-11-claude-config-setup.md
      - Paper Pipeline: superpowers/plans/2026-04-11-paper-pipeline.md
      - Building Bootstrap: superpowers/plans/2026-04-14-building-bootstrap.md
      - MCP Server: superpowers/plans/2026-04-14-mcp-server.md
      - Capability Semantic Routing: superpowers/plans/2026-05-21-capability-semantic-routing-plan.md
    - Specs:
      - Orchestrator Recovery Design: superpowers/specs/2026-03-31-orchestrator-recovery-design.md
      - Claude Config Design: superpowers/specs/2026-04-11-claude-config-design.md
      - Paper Writing Design: superpowers/specs/2026-04-11-paper-writing-design.md
      - Building Bootstrap Design: superpowers/specs/2026-04-14-building-bootstrap-design.md
      - MCP Server Design: superpowers/specs/2026-04-14-mcp-server-design.md
      - Capability Semantic Routing Design: superpowers/specs/2026-05-21-capability-semantic-routing-design.md
      - Multi-Intent Semantic Routing: superpowers/specs/2026-05-22-multi-intent-semantic-routing.md
