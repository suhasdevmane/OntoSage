[pytest]
asyncio_mode = auto
testpaths = tests
# CAVEAT-1113: a non-strict xfail cannot tell you it has started passing. Six of them sat
# XPASS on a defect (CAVEAT-952) that had been fixed hours earlier, and the suite total did
# not move, because xpassed is neither a failure nor a pass and no gate reads it. This makes
# strict the DEFAULT for any marker that does not say otherwise. Measured before landing:
# an explicit strict=False on the marker still wins, so the two pytest.mark.live xfails
# (test_capability_e2e.py:187, test_non_regression_intents.py:133) are unaffected, and the
# one xfail inside -m unit (test_event_and_capacity_provisioning.py:172, BUG-695) already
# sets strict=True. Nothing in the tree changes today; the next marker written without a
# strict kwarg will fail loudly when its defect is fixed, which is the whole point.
xfail_strict = true
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = INFO
timeout = 120
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

markers =
    unit: fast, isolated unit tests
    integration: tests requiring mock services
    slow: long-running tests (benchmark)
    live: tests requiring live Docker services (graphdb, mysql, redis)
    allow_network: a unit test that genuinely needs outbound network (CAVEAT-408 escape hatch)
