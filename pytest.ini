[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = INFO
timeout = 120
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

markers =
    unit: fast, isolated unit tests
    integration: tests requiring mock services
    slow: long-running tests (benchmark)
    live: tests requiring live Docker services (graphdb, mysql, redis)
