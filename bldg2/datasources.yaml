# ============================================================================
# OntoSage — Data sources (bldg2) · SATURATE simulated modalities (V4-T09)
# ============================================================================
# These sources exist primarily for PROVENANCE: every narrow table written by
# the saturation pipeline is declared here so provenance chips render each
# figure as "· simulated" (an undeclared table would render as Unknown Source).
#
# Unlike bldg1's toggle sources these are enabled and lock nothing (`unlocks`
# empty): the saturation TTLs load via ttl_uploader named graphs, which are the
# per-modality on/off switch (drop the graph via the admin portal to disable).
# UUIDs derive deterministically from (building_id, "sat_<modality>", space).
# ============================================================================
version: 1
datasources:

  - id: sat_temperature
    label: "Temperature (simulated)"
    modality: temperature
    kind: timeseries
    enabled: true
    synthetic: true
    provenance_system: "Simulated Temperature Sensing"
    color: "#F59E0B"
    ts_table: temperature_data
    unlocks: []

