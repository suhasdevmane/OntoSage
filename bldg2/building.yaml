# ── Building identity: bldg2 (BuildSys reference building) ───────────────────
# The ontology_namespace below MUST match the `@prefix bldg:` declared in
# bldg2.ttl exactly — the startup TTL validator hard-fails the boot on a
# mismatch, so a silently-empty knowledge graph is impossible.
building_id: bldg2
building_name: "BuildSys Building (bldg2)"
ontology_namespace: "http://buildsys.org/ontologies/bldg2#"
ontology_prefix: bldg          # bldg2.ttl uses the standard `bldg:` label

# ── Data provenance (building-level) ─────────────────────────────────────────
# Describes the WHOLE building — its ontology, sensors AND readings — which is a
# broader statement than `nature:` on a single connection in database_registry.yaml
# (that refines one data source). Both are read live; neither is hardcoded in code,
# so a new building declares its own answer.
#   real      — a real building: the model describes actual equipment and the
#               readings come from it
#   synthetic — a fabricated building: ontology, sensors and every reading generated
#   mixed     — a real building where SOME sources are generated (see per-source nature)
provenance:
  nature: synthetic
  note: "Portability fixture. The ontology, its sensors and every reading are generated — no element of this building corresponds to real equipment."

# Off-ontology capability KB routing (defaults are fine for most buildings).
capability_routing:
  enabled: true
  embedding_model: auto        # follows EMBEDDING_PROVIDER (openai | local)
  threshold: 0.56
  override_min: 0.60
  top_k: 5
  fallback_on_qdrant_failure: skip

# Which database_registry.yaml keys this building uses. bldg2.ttl routes every
# sensor to `ref:storedAt bldg:database1`, which is env-driven
# (${MYSQL_DATABASE}) — point it at bldg2_sensordb in .env2.
storage:
  databases:
    - database2
    # SATURATE narrow tables (V4-T09) — simulated per-room modalities
    - temperature_data
    - humidity_data
    - co2_data
    - occupancy_data
    - noise_data
    - light_data
    - contact_data
    # V5 Event Framework (T07) - generic interval/event store
    - events_data
    # V5-T09 scalar expansion
    - pm25_data
    - submeter_data
    # TODO-143 — the two backends the paper's building table names, stood up so
    # the claim is reproducible from the artifact. ADDITIVE: no sensor's
    # ref:storedAt points here, so nothing this building already answers
    # changes; the adapters simply become reachable. Start them with
    # docker-compose.timeseries-backends.yml and seed with
    # scripts/seed_timeseries_backends.py.
    - timescaledb
    - cassandra
    - waterflow_data
    - parking_data

# No floor plans provided yet → spatial/floor queries will honestly report that
# there is no floor plan for this building (watch the building_registry residual).
floor_plan_aliases: []

# Read-only building — no actuation.
actuation:
  driver: none
  points_writable: []
