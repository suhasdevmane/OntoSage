# Service / maintenance / supply contracts -> ontosage:Contract
#
# Ships with the ONTOLOGY, not with any building.
record_type: contract
class: ontosage:Contract
iri_template: "contract/{reference}"
label_column: reference

columns:
  reference:
    predicate: ontosage:recordId
    datatype: xsd:string
    required: true
  scope:
    predicate: ontosage:coveredScope
    datatype: xsd:string
    required: true
  provider:
    predicate: ontosage:providerName
    datatype: xsd:string
    required: true
  start:
    predicate: ontosage:effectiveFrom
    datatype: xsd:date
    required: true
  end:
    predicate: ontosage:effectiveTo
    datatype: xsd:date
    required: true
  status:
    predicate: ontosage:recordStatus
    datatype: xsd:string
    required: true
    values:
      active: ["Active", "Live", "In force", "Current"]
      expired: ["Expired", "Ended", "Lapsed"]
      notice: ["Notice served", "Under notice", "Terminating"]
  owner_role:
    predicate: ontosage:responsibleRole
    datatype: xsd:string
