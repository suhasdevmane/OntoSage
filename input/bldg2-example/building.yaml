# EXAMPLE: input/bldg2/building.yaml
# ===================================
# This directory is a complete skeleton showing every config knob a new
# building can declare.  Rename to `bldg2/` and set BUILDING_ID=bldg2 to
# activate.  Nothing else needs to change in the codebase.
#
# Phase coverage:
#   Phase 1 — logical BUILDING_ID, BUILDING_NAME come from this file
#   Phase 2 — storage adapter binding (only init what we use)
#   Phase 3 — TTL files in input/bldg2/*.ttl auto-uploaded on startup
#   Phase 4 — floor_plan_aliases handles PDF filename slug mismatches
#   Phase 4 — zone_id_pattern can be anything (e.g. "R{floor}{nn}" for R301)
#   Phase 5 — input/bldg2/personas/*.yaml overrides global personas
#   Phase 6 — capability.yaml has been the standard since 2026-05
#   Phase 8 — input/bldg2/intents.yaml can add building-specific intents

# ── Identity ──────────────────────────────────────────────────────────────────

building_id: bldg2
building_name: Cardiff School of Engineering
display_name: Cardiff Engineering Building

# Aliases this building also responds to (e.g. legacy PDF filename slugs).
floor_plan_aliases:
  - cardiff_eng
  - cardiff_engineering

# ── Zone IDs ──────────────────────────────────────────────────────────────────
#
# This building uses room codes like "R301", "R102B".  The default pattern
# (Abacws-style 5.28) wouldn't match — declare the building's own here.
#
# Template tokens:
#   {floor}   → one or more digits
#   {nn}      → two-digit room suffix
#   {nnn}     → three-digit room suffix
# Or provide a raw Python regex string.

zone_id_pattern: "R{floor}{nn}"

# ── Storage adapters ──────────────────────────────────────────────────────────
#
# Reference keys from config/database_registry.yaml.  The adapter registry
# initialises only what is listed here, dramatically reducing startup time.
#
# UUID pattern routing (optional) sends different sensor types to different
# backends — useful for heterogeneous deployments.

storage:
  primary: postgresql1            # default backend for sensor lookups
  databases:
    - postgresql1                 # bulk temperature/CO2/humidity
    - influxdb1                   # high-frequency power meters
  routes:
    - pattern: "power-*"
      backend: influxdb1
    - pattern: "*"
      backend: postgresql1
  fallback: postgresql1

# ── Capability routing thresholds (calibrate per embedding model) ────────────

capability_routing:
  enabled: true
  embedding_model: auto
  threshold: 0.56
  override_min: 0.60
  top_k: 5
  fallback_on_qdrant_failure: skip

# ── Per-building DWG layer overrides (optional) ──────────────────────────────
#
# If Cardiff's CAD uses different layer-name conventions, list overrides here.
# Merged on top of the AIA/NCS defaults in shared/floor_plan_config.py.
#
# layer_map:
#   "(?i)CARDIFF_ROOM": "room_boundary"
#   "(?i)CARDIFF_WALL": "wall"
