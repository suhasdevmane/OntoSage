# ============================================================================
# OntoSage Database Registry — Universal Edition
# ============================================================================
#
# HOW IT WORKS
# ─────────────
# In your TTL file, add a storedAt reference matching any key below:
#
#   _:ref ref:hasTimeseriesId "a8df8757-009a-..." ;
#         ref:storedAt        bldg:mariadb .        ← key = "mariadb"
#
# The registry reads this key, looks it up here, and routes every SQL /
# query call to the correct database — automatically, at query time.
#
# URI FORMS SUPPORTED
# ───────────────────
#   bldg:mariadb                      → key "mariadb"
#   <http://example.org/bldg#mariadb> → key "mariadb"
#   <http://example.org/bldg/mariadb> → key "mariadb"
#
# ENV-VAR SUBSTITUTION
# ─────────────────────
#   ${VAR_NAME}           required  — startup fails if unset
#   ${VAR_NAME:-default}  optional  — falls back to default
#
# ADAPTER TYPES (all currently available)
# ─────────────────────────────────────────
#   mysql            MySQL / MariaDB / TDengine       (aiomysql)
#   postgresql       PostgreSQL / Aurora / Neon …     (asyncpg)
#   timescaledb      TimescaleDB hypertables           (asyncpg)
#   mongodb          MongoDB / Atlas / DocumentDB …   (motor)
#   influxdb         InfluxDB 2.x — Flux queries      (influxdb-client)
#   sqlite           SQLite / DuckDB / libsql          (aiosqlite)
#   cassandra        Cassandra / ScyllaDB / AstraDB   (cassandra-driver)
#   redis_timeseries Redis + RedisTimeSeries module    (redis.asyncio)
#
# FUTURE ADAPTER TYPES (commented out — wire up adapter, then uncomment)
#   clickhouse       ClickHouse OLAP
#   elasticsearch    Elasticsearch / OpenSearch
#   neo4j            Neo4j (graph/cypher)
#   mssql            Microsoft SQL Server / Azure SQL
#   oracle           Oracle Database
#   prometheus       Prometheus metrics store
#   hbase            Apache HBase
#   dynamodb         AWS DynamoDB
#
# ─────────────────────────────────────────────────────────────────────────────
# ACTIVATION CHECKLIST for a new building
# ─────────────────────────────────────────────────────────────────────────────
# 1. Uncomment / copy the block that matches your database technology.
# 2. Set the env vars in your .env file (see .env.example).
# 3. In your TTL file: _:ref ref:storedAt bldg:<key> .
# 4. Restart the orchestrator — no code changes needed.
# ============================================================================


databases:

  # ── PostgreSQL time-series (a SECOND backend technology for this building) ──
  # Demonstrates the pluggable-datasource claim: MySQL and PostgreSQL serve the same
  # building simultaneously, chosen per sensor by `ref:storedAt`. Narrow shape:
  # (uuid, datetime, value). Adding a backend needs no code — only this entry.
  # TTL: ref:storedAt bldg:database_pg
  database_pg:
    type: postgresql
    host: "${POSTGRES_USER_HOST:-postgres-user-data}"   # the running user/app Postgres
    port: "${POSTGRES_PORT:-5432}"
    user: "${POSTGRES_USER_USER:-ontobot}"
    password: "${POSTGRES_USER_PASSWORD:-ontobot_secret}"
    database: "${POSTGRES_USER_DB:-ontobot}"
    table: sensor_timeseries
    nature: synthetic
    note: "PostgreSQL narrow time-series · second backend technology for this building"

  # ══════════════════════════════════════════════════════════════════════════
  # (1)  MySQL / MariaDB family
  #    Adapter: mysql  (aiomysql)
  #    Wire protocol compatible: MySQL, MariaDB, TiDB, SingleStore, TDengine
  # ══════════════════════════════════════════════════════════════════════════

  # Primary MySQL instance (bldg3 live source — always active)
  # TTL: ref:storedAt bldg:database1
  database1:
    type: mysql
    host: "${MYSQL_HOST:-mysql}"
    port: "${MYSQL_PORT:-3306}"
    user: "${MYSQL_USER:-root}"
    password: "${MYSQL_PASSWORD:-mysql}"
    database: "${MYSQL_DATABASE:-bldg3_sensordb}"
    nature: synthetic     # bldg3 is a portability/demo building — rows are fabricated
    note: "bldg3 synthetic time-series (wide sensor_data, generated by data-publisher)"

  # ── Narrow per-modality time-series tables (uuid, datetime, value) ──────────
  # Standardized out of input/data CSVs (scripts/generate_timeseries_extension.py
  # + scripts/load_timeseries_to_db.py). Each table is its own storage backend,
  # reached from the ontology via `ref:storedAt bldg:<table>`. Same MySQL instance
  # as database1; `type: mysql_narrow` + `table:` scope the adapter to one table.
  energy_data:
    type: mysql_narrow
    table: energy_data
    host: "${MYSQL_HOST:-mysql}"
    port: "${MYSQL_PORT:-3306}"
    user: "${MYSQL_USER:-root}"
    password: "${MYSQL_PASSWORD:-mysql}"
    database: "${MYSQL_DATABASE:-sensordb}"
    nature: synthetic
    note: "demo source (datasources.yaml) · synthetic series"
  occupancy_data:
    type: mysql_narrow
    table: occupancy_data
    host: "${MYSQL_HOST:-mysql}"
    port: "${MYSQL_PORT:-3306}"
    user: "${MYSQL_USER:-root}"
    password: "${MYSQL_PASSWORD:-mysql}"
    database: "${MYSQL_DATABASE:-sensordb}"
    nature: synthetic
    note: "demo source (datasources.yaml) · synthetic series"
  water_data:
    type: mysql_narrow
    table: water_data
    host: "${MYSQL_HOST:-mysql}"
    port: "${MYSQL_PORT:-3306}"
    user: "${MYSQL_USER:-root}"
    password: "${MYSQL_PASSWORD:-mysql}"
    database: "${MYSQL_DATABASE:-sensordb}"
    nature: synthetic
    note: "demo source (datasources.yaml) · synthetic series"
  noise_data:
    type: mysql_narrow
    table: noise_data
    host: "${MYSQL_HOST:-mysql}"
    port: "${MYSQL_PORT:-3306}"
    user: "${MYSQL_USER:-root}"
    password: "${MYSQL_PASSWORD:-mysql}"
    database: "${MYSQL_DATABASE:-sensordb}"
    nature: synthetic
    note: "demo source (datasources.yaml) · synthetic series"
  iaq_data:
    type: mysql_narrow
    table: iaq_data
    host: "${MYSQL_HOST:-mysql}"
    port: "${MYSQL_PORT:-3306}"
    user: "${MYSQL_USER:-root}"
    password: "${MYSQL_PASSWORD:-mysql}"
    database: "${MYSQL_DATABASE:-sensordb}"
    nature: synthetic
    note: "demo source (datasources.yaml) · synthetic series"
  light_data:
    type: mysql_narrow
    table: light_data
    host: "${MYSQL_HOST:-mysql}"
    port: "${MYSQL_PORT:-3306}"
    user: "${MYSQL_USER:-root}"
    password: "${MYSQL_PASSWORD:-mysql}"
    database: "${MYSQL_DATABASE:-sensordb}"
    nature: synthetic
    note: "demo source (datasources.yaml) · synthetic series"
  equipment_data:
    type: mysql_narrow
    table: equipment_data
    host: "${MYSQL_HOST:-mysql}"
    port: "${MYSQL_PORT:-3306}"
    user: "${MYSQL_USER:-root}"
    password: "${MYSQL_PASSWORD:-mysql}"
    database: "${MYSQL_DATABASE:-sensordb}"
    nature: synthetic
    note: "demo source (datasources.yaml) · synthetic series"

  # Floors 0-4 sensors (522 real abacws sensors) — demo timeseries in a narrow table.
  # TTL: ref:storedAt bldg:database1_floors04 (re-pointed from database1, which is
  # column-capped and cannot hold these as wide columns).
  database1_floors04:
    type: mysql_narrow
    table: sensor_data_floors04
    host: "${MYSQL_HOST:-mysql}"
    port: "${MYSQL_PORT:-3306}"
    user: "${MYSQL_USER:-root}"
    password: "${MYSQL_PASSWORD:-mysql}"
    database: "${MYSQL_DATABASE:-sensordb}"
    nature: synthetic     # generated demo table (holds 522 real floor 0-4 sensors' readings)
    note: "522 floor 0-4 sensors · generated demo table"

  # Synthetic enhancement sensors (106 placeholder UUIDs) — demo timeseries.
  # TTL: ref:storedAt bldg:database1_synth
  database1_synth:
    type: mysql_narrow
    table: sensor_data_synth
    host: "${MYSQL_HOST:-mysql}"
    port: "${MYSQL_PORT:-3306}"
    user: "${MYSQL_USER:-root}"
    password: "${MYSQL_PASSWORD:-mysql}"
    database: "${MYSQL_DATABASE:-sensordb}"
    nature: synthetic     # synthetic placeholder sensors + demo timeseries
    note: "106 synthetic sensors · demo timeseries"

  # MariaDB (drop-in MySQL replacement)
  # TTL: ref:storedAt bldg:mariadb
  mariadb:
    type: mysql
    host: "${MARIADB_HOST:-mariadb}"
    port: "${MARIADB_PORT:-3306}"
    user: "${MARIADB_USER:-ontosage}"
    password: "${MARIADB_PASSWORD:-ontosage}"
    database: "${MARIADB_DATABASE:-sensordb}"

  # MariaDB Galera Cluster (HA multi-master)
  # TTL: ref:storedAt bldg:mariadb-galera
  mariadb-galera:
    type: mysql
    host: "${MARIADB_GALERA_HOST:-mariadb-galera}"
    port: "${MARIADB_GALERA_PORT:-3306}"
    user: "${MARIADB_GALERA_USER:-ontosage}"
    password: "${MARIADB_GALERA_PASSWORD:-ontosage}"
    database: "${MARIADB_GALERA_DATABASE:-sensordb}"

  # AWS RDS MySQL
  # TTL: ref:storedAt bldg:mysql-rds
  mysql-rds:
    type: mysql
    host: "${MYSQL_RDS_HOST:-}"
    port: "${MYSQL_RDS_PORT:-3306}"
    user: "${MYSQL_RDS_USER:-admin}"
    password: "${MYSQL_RDS_PASSWORD:-}"
    database: "${MYSQL_RDS_DATABASE:-sensordb}"

  # AWS Aurora MySQL (serverless-compatible — same MySQL wire protocol)
  # TTL: ref:storedAt bldg:aurora-mysql
  aurora-mysql:
    type: mysql
    host: "${AURORA_MYSQL_HOST:-}"
    port: "${AURORA_MYSQL_PORT:-3306}"
    user: "${AURORA_MYSQL_USER:-admin}"
    password: "${AURORA_MYSQL_PASSWORD:-}"
    database: "${AURORA_MYSQL_DATABASE:-sensordb}"

  # Azure Database for MySQL (Flexible Server)
  # TTL: ref:storedAt bldg:mysql-azure
  mysql-azure:
    type: mysql
    host: "${MYSQL_AZURE_HOST:-}"
    port: "${MYSQL_AZURE_PORT:-3306}"
    user: "${MYSQL_AZURE_USER:-ontosage}"
    password: "${MYSQL_AZURE_PASSWORD:-}"
    database: "${MYSQL_AZURE_DATABASE:-sensordb}"

  # Google Cloud SQL — MySQL edition
  # TTL: ref:storedAt bldg:mysql-cloudsql
  mysql-cloudsql:
    type: mysql
    host: "${MYSQL_CLOUDSQL_HOST:-}"
    port: "${MYSQL_CLOUDSQL_PORT:-3306}"
    user: "${MYSQL_CLOUDSQL_USER:-ontosage}"
    password: "${MYSQL_CLOUDSQL_PASSWORD:-}"
    database: "${MYSQL_CLOUDSQL_DATABASE:-sensordb}"

  # SingleStore (MemSQL) — MySQL-compatible OLAP
  # TTL: ref:storedAt bldg:singlestore
  singlestore:
    type: mysql
    host: "${SINGLESTORE_HOST:-singlestore}"
    port: "${SINGLESTORE_PORT:-3306}"
    user: "${SINGLESTORE_USER:-ontosage}"
    password: "${SINGLESTORE_PASSWORD:-}"
    database: "${SINGLESTORE_DATABASE:-sensordb}"

  # TiDB — MySQL-compatible distributed HTAP
  # TTL: ref:storedAt bldg:tidb
  tidb:
    type: mysql
    host: "${TIDB_HOST:-tidb}"
    port: "${TIDB_PORT:-4000}"
    user: "${TIDB_USER:-root}"
    password: "${TIDB_PASSWORD:-}"
    database: "${TIDB_DATABASE:-sensordb}"

  # TDengine — IoT time-series with MySQL wire protocol
  # Optimised for sensor data; each device is a sub-table
  # TTL: ref:storedAt bldg:tdengine
  tdengine:
    type: mysql
    host: "${TDENGINE_HOST:-tdengine}"
    port: "${TDENGINE_PORT:-6030}"
    user: "${TDENGINE_USER:-root}"
    password: "${TDENGINE_PASSWORD:-taosdata}"
    database: "${TDENGINE_DATABASE:-power}"


  # ══════════════════════════════════════════════════════════════════════════
  # ②  PostgreSQL family
  #    Adapter: postgresql  (asyncpg)
  #    Wire protocol compatible: PostgreSQL, CockroachDB, YugabyteDB,
  #    AlloyDB, Aurora PG, Neon, Supabase, Citus, QuestDB, CrateDB, Greenplum
  # ══════════════════════════════════════════════════════════════════════════

  # Primary PostgreSQL instance (Building 2)
  # TTL: ref:storedAt bldg:database2 — bldg2's OWN MySQL DB (wide sensor_data table).
  # Env-driven so it resolves to MYSQL_DATABASE (bldg2_sensordb); mirrors database1's shape.
  # All 378 bldg2 sensors route here (single key ⇒ wide table, uuid columns + datetime).
  database2:
    type: mysql
    host: "${MYSQL_HOST:-mysql}"
    port: "${MYSQL_PORT:-3306}"
    user: "${MYSQL_USER:-root}"
    password: "${MYSQL_PASSWORD:-mysql}"
    database: "${MYSQL_DATABASE:-bldg2_sensordb}"
    nature: synthetic
    note: "bldg2 synthetic time-series (wide sensor_data)"

  # CockroachDB — distributed, PostgreSQL-compatible
  # TTL: ref:storedAt bldg:cockroachdb
  cockroachdb:
    type: postgresql
    host: "${COCKROACH_HOST:-cockroachdb}"
    port: "${COCKROACH_PORT:-26257}"
    user: "${COCKROACH_USER:-root}"
    password: "${COCKROACH_PASSWORD:-}"
    database: "${COCKROACH_DATABASE:-defaultdb}"

  # YugabyteDB — distributed PostgreSQL-compatible
  # TTL: ref:storedAt bldg:yugabytedb
  yugabytedb:
    type: postgresql
    host: "${YUGABYTE_HOST:-yugabytedb}"
    port: "${YUGABYTE_PORT:-5433}"
    user: "${YUGABYTE_USER:-yugabyte}"
    password: "${YUGABYTE_PASSWORD:-yugabyte}"
    database: "${YUGABYTE_DATABASE:-yugabyte}"

  # Google AlloyDB (PostgreSQL-compatible, enterprise cloud)
  # TTL: ref:storedAt bldg:alloydb
  alloydb:
    type: postgresql
    host: "${ALLOYDB_HOST:-}"
    port: "${ALLOYDB_PORT:-5432}"
    user: "${ALLOYDB_USER:-ontosage}"
    password: "${ALLOYDB_PASSWORD:-}"
    database: "${ALLOYDB_DATABASE:-sensordb}"

  # AWS RDS PostgreSQL
  # TTL: ref:storedAt bldg:pg-rds
  pg-rds:
    type: postgresql
    host: "${PG_RDS_HOST:-}"
    port: "${PG_RDS_PORT:-5432}"
    user: "${PG_RDS_USER:-postgres}"
    password: "${PG_RDS_PASSWORD:-}"
    database: "${PG_RDS_DATABASE:-sensordb}"

  # AWS Aurora PostgreSQL
  # TTL: ref:storedAt bldg:aurora-pg
  aurora-pg:
    type: postgresql
    host: "${AURORA_PG_HOST:-}"
    port: "${AURORA_PG_PORT:-5432}"
    user: "${AURORA_PG_USER:-postgres}"
    password: "${AURORA_PG_PASSWORD:-}"
    database: "${AURORA_PG_DATABASE:-sensordb}"

  # Azure Database for PostgreSQL (Flexible Server)
  # TTL: ref:storedAt bldg:pg-azure
  pg-azure:
    type: postgresql
    host: "${PG_AZURE_HOST:-}"
    port: "${PG_AZURE_PORT:-5432}"
    user: "${PG_AZURE_USER:-ontosage}"
    password: "${PG_AZURE_PASSWORD:-}"
    database: "${PG_AZURE_DATABASE:-sensordb}"

  # Supabase PostgreSQL (managed)
  # TTL: ref:storedAt bldg:supabase
  supabase:
    type: postgresql
    host: "${SUPABASE_DB_HOST:-}"
    port: "${SUPABASE_DB_PORT:-5432}"
    user: "${SUPABASE_DB_USER:-postgres}"
    password: "${SUPABASE_DB_PASSWORD:-}"
    database: "${SUPABASE_DB_DATABASE:-postgres}"

  # Neon — serverless PostgreSQL
  # TTL: ref:storedAt bldg:neon
  neon:
    type: postgresql
    host: "${NEON_HOST:-}"
    port: "${NEON_PORT:-5432}"
    user: "${NEON_USER:-}"
    password: "${NEON_PASSWORD:-}"
    database: "${NEON_DATABASE:-neondb}"

  # Citus — distributed PostgreSQL for analytics
  # TTL: ref:storedAt bldg:citus
  citus:
    type: postgresql
    host: "${CITUS_HOST:-citus-coordinator}"
    port: "${CITUS_PORT:-5432}"
    user: "${CITUS_USER:-ontosage}"
    password: "${CITUS_PASSWORD:-ontosage}"
    database: "${CITUS_DATABASE:-sensordb}"

  # CrateDB — distributed PostgreSQL-compatible for IoT/time-series
  # TTL: ref:storedAt bldg:cratedb
  cratedb:
    type: postgresql
    host: "${CRATEDB_HOST:-cratedb}"
    port: "${CRATEDB_PORT:-5432}"
    user: "${CRATEDB_USER:-crate}"
    password: "${CRATEDB_PASSWORD:-}"
    database: "${CRATEDB_DATABASE:-doc}"

  # Greenplum — MPP analytics PostgreSQL
  # TTL: ref:storedAt bldg:greenplum
  greenplum:
    type: postgresql
    host: "${GREENPLUM_HOST:-greenplum}"
    port: "${GREENPLUM_PORT:-5432}"
    user: "${GREENPLUM_USER:-gpadmin}"
    password: "${GREENPLUM_PASSWORD:-}"
    database: "${GREENPLUM_DATABASE:-sensordb}"

  # QuestDB — high-performance time-series with PostgreSQL wire protocol
  # Listens on port 8812 for PG wire; native SQL + time-series extensions
  # TTL: ref:storedAt bldg:questdb
  questdb:
    type: postgresql
    host: "${QUESTDB_HOST:-questdb}"
    port: "${QUESTDB_PORT:-8812}"
    user: "${QUESTDB_USER:-admin}"
    password: "${QUESTDB_PASSWORD:-quest}"
    database: "${QUESTDB_DATABASE:-qdb}"


  # ══════════════════════════════════════════════════════════════════════════
  # ③  TimescaleDB family
  #    Adapter: timescaledb  (asyncpg, PostgreSQL-compatible + hypertable SQL)
  # ══════════════════════════════════════════════════════════════════════════

  # Building 3 TimescaleDB (self-hosted)
  # TTL: ref:storedAt bldg:database3
  database3:
    type: timescaledb
    host: "${TIMESCALE_HOST:-timescaledb}"
    port: "${TIMESCALE_PORT:-5432}"
    user: "${TIMESCALE_USER:-ontosage}"
    password: "${TIMESCALE_PASSWORD:-ontosage}"
    database: "${TIMESCALE_DATABASE:-bldg3}"

  # Timescale Cloud (managed SaaS)
  # TTL: ref:storedAt bldg:timescale-cloud
  timescale-cloud:
    type: timescaledb
    host: "${TIMESCALE_CLOUD_HOST:-}"
    port: "${TIMESCALE_CLOUD_PORT:-5432}"
    user: "${TIMESCALE_CLOUD_USER:-tsdbadmin}"
    password: "${TIMESCALE_CLOUD_PASSWORD:-}"
    database: "${TIMESCALE_CLOUD_DATABASE:-tsdb}"

  # AWS RDS + TimescaleDB extension
  # TTL: ref:storedAt bldg:timescale-rds
  timescale-rds:
    type: timescaledb
    host: "${TIMESCALE_RDS_HOST:-}"
    port: "${TIMESCALE_RDS_PORT:-5432}"
    user: "${TIMESCALE_RDS_USER:-postgres}"
    password: "${TIMESCALE_RDS_PASSWORD:-}"
    database: "${TIMESCALE_RDS_DATABASE:-sensordb}"


  # ══════════════════════════════════════════════════════════════════════════
  # ④  MongoDB family
  #    Adapter: mongodb  (motor async driver)
  #    Compatible: MongoDB self-hosted, Atlas, DocumentDB, CosmosDB Mongo API
  # ══════════════════════════════════════════════════════════════════════════

  # Building 4 MongoDB (self-hosted)
  # TTL: ref:storedAt bldg:database4
  database4:
    type: mongodb
    host: "${MONGO_HOST:-mongodb}"
    port: "${MONGO_PORT:-27017}"
    user: "${MONGO_USER:-}"
    password: "${MONGO_PASSWORD:-}"
    database: "${MONGO_DATABASE:-bldg4}"
    collection: "${MONGO_COLLECTION:-sensor_data}"

  # MongoDB Atlas (cloud, connect via SRV URI)
  # Set MONGO_ATLAS_HOST to your cluster SRV hostname
  # TTL: ref:storedAt bldg:mongodb-atlas
  mongodb-atlas:
    type: mongodb
    host: "${MONGO_ATLAS_HOST:-}"
    port: "${MONGO_ATLAS_PORT:-27017}"
    user: "${MONGO_ATLAS_USER:-}"
    password: "${MONGO_ATLAS_PASSWORD:-}"
    database: "${MONGO_ATLAS_DATABASE:-sensordb}"
    collection: "${MONGO_ATLAS_COLLECTION:-sensor_data}"

  # AWS DocumentDB (MongoDB-compatible)
  # TTL: ref:storedAt bldg:documentdb
  documentdb:
    type: mongodb
    host: "${DOCUMENTDB_HOST:-}"
    port: "${DOCUMENTDB_PORT:-27017}"
    user: "${DOCUMENTDB_USER:-}"
    password: "${DOCUMENTDB_PASSWORD:-}"
    database: "${DOCUMENTDB_DATABASE:-sensordb}"
    collection: "${DOCUMENTDB_COLLECTION:-sensor_data}"

  # Azure CosmosDB — MongoDB API
  # TTL: ref:storedAt bldg:cosmosdb-mongo
  cosmosdb-mongo:
    type: mongodb
    host: "${COSMOS_MONGO_HOST:-}"
    port: "${COSMOS_MONGO_PORT:-10255}"
    user: "${COSMOS_MONGO_USER:-}"
    password: "${COSMOS_MONGO_PASSWORD:-}"
    database: "${COSMOS_MONGO_DATABASE:-sensordb}"
    collection: "${COSMOS_MONGO_COLLECTION:-sensor_data}"

  # FerretDB (MongoDB API on PostgreSQL — open source alternative)
  # TTL: ref:storedAt bldg:ferretdb
  ferretdb:
    type: mongodb
    host: "${FERRETDB_HOST:-ferretdb}"
    port: "${FERRETDB_PORT:-27017}"
    user: "${FERRETDB_USER:-}"
    password: "${FERRETDB_PASSWORD:-}"
    database: "${FERRETDB_DATABASE:-sensordb}"
    collection: "${FERRETDB_COLLECTION:-sensor_data}"


  # ══════════════════════════════════════════════════════════════════════════
  # ⑤  InfluxDB family
  #    Adapter: influxdb  (influxdb-client, Flux query language)
  # ══════════════════════════════════════════════════════════════════════════

  # Building 5 InfluxDB 2.x (self-hosted)
  # TTL: ref:storedAt bldg:database5
  database5:
    type: influxdb
    url: "${INFLUX_URL:-http://influxdb:8086}"
    token: "${INFLUX_TOKEN:-}"
    org: "${INFLUX_ORG:-ontosage}"
    bucket: "${INFLUX_BUCKET:-sensors}"

  # InfluxDB Cloud (cloud managed, Flux)
  # TTL: ref:storedAt bldg:influxdb-cloud
  influxdb-cloud:
    type: influxdb
    url: "${INFLUX_CLOUD_URL:-https://us-east-1-1.aws.cloud2.influxdata.com}"
    token: "${INFLUX_CLOUD_TOKEN:-}"
    org: "${INFLUX_CLOUD_ORG:-}"
    bucket: "${INFLUX_CLOUD_BUCKET:-sensors}"

  # VictoriaMetrics (InfluxDB line protocol write-compatible)
  # Reads via HTTP API — use influxdb adapter with VM's /query endpoint
  # TTL: ref:storedAt bldg:victoriametrics
  victoriametrics:
    type: influxdb
    url: "${VM_URL:-http://victoriametrics:8428}"
    token: "${VM_TOKEN:-}"
    org: "${VM_ORG:-}"
    bucket: "${VM_BUCKET:-}"


  # ══════════════════════════════════════════════════════════════════════════
  # ⑥  SQLite family
  #    Adapter: sqlite  (aiosqlite)
  #    Compatible: SQLite, DuckDB (file mode), libsql / Turso
  # ══════════════════════════════════════════════════════════════════════════

  # Building 6 SQLite (local file)
  # TTL: ref:storedAt bldg:database6
  database6:
    type: sqlite
    path: "${SQLITE_PATH:-/app/data/bldg6.db}"

  # SQLite dev/test in-memory instance
  # TTL: ref:storedAt bldg:sqlite-memory
  sqlite-memory:
    type: sqlite
    path: ":memory:"

  # DuckDB — analytical, SQLite-compatible Python API (file mode)
  # NOTE: DuckDB uses the SQLiteAdapter's aiosqlite interface only for
  # simple queries; for full DuckDB support a dedicated adapter is preferred.
  # TTL: ref:storedAt bldg:duckdb
  duckdb:
    type: sqlite
    path: "${DUCKDB_PATH:-/app/data/analytics.duckdb}"

  # libsql / Turso (SQLite-compatible embedded DB)
  # TTL: ref:storedAt bldg:libsql
  libsql:
    type: sqlite
    path: "${LIBSQL_PATH:-/app/data/turso.db}"


  # ══════════════════════════════════════════════════════════════════════════
  # ⑦  Apache Cassandra family
  #    Adapter: cassandra  (cassandra-driver, CQL)
  #    Compatible: Cassandra, ScyllaDB, DataStax AstraDB
  # ══════════════════════════════════════════════════════════════════════════

  # Building 7 Cassandra (self-hosted)
  # TTL: ref:storedAt bldg:database7
  database7:
    type: cassandra
    host: "${CASSANDRA_HOST:-cassandra}"
    port: "${CASSANDRA_PORT:-9042}"
    keyspace: "${CASSANDRA_KEYSPACE:-bldg7}"
    user: "${CASSANDRA_USER:-}"
    password: "${CASSANDRA_PASSWORD:-}"
    table: "${CASSANDRA_TABLE:-sensor_data}"

  # ScyllaDB — Cassandra-compatible, 10x faster (same CQL wire protocol)
  # TTL: ref:storedAt bldg:scylladb
  scylladb:
    type: cassandra
    host: "${SCYLLA_HOST:-scylladb}"
    port: "${SCYLLA_PORT:-9042}"
    keyspace: "${SCYLLA_KEYSPACE:-sensors}"
    user: "${SCYLLA_USER:-}"
    password: "${SCYLLA_PASSWORD:-}"
    table: "${SCYLLA_TABLE:-sensor_data}"

  # DataStax AstraDB (Cassandra-as-a-Service)
  # Use the Secure Connect Bundle path; host/port are overridden by the bundle
  # TTL: ref:storedAt bldg:astradb
  astradb:
    type: cassandra
    host: "${ASTRA_HOST:-}"
    port: "${ASTRA_PORT:-9042}"
    keyspace: "${ASTRA_KEYSPACE:-sensors}"
    user: "${ASTRA_CLIENT_ID:-}"
    password: "${ASTRA_CLIENT_SECRET:-}"
    table: "${ASTRA_TABLE:-sensor_data}"

  # Amazon Keyspaces (Cassandra-compatible managed by AWS)
  # TTL: ref:storedAt bldg:keyspaces
  keyspaces:
    type: cassandra
    host: "${KEYSPACES_HOST:-cassandra.us-east-1.amazonaws.com}"
    port: "${KEYSPACES_PORT:-9142}"
    keyspace: "${KEYSPACES_KEYSPACE:-sensors}"
    user: "${KEYSPACES_USER:-}"
    password: "${KEYSPACES_PASSWORD:-}"
    table: "${KEYSPACES_TABLE:-sensor_data}"


  # ══════════════════════════════════════════════════════════════════════════
  # ⑧  Redis TimeSeries family
  #    Adapter: redis_timeseries  (redis.asyncio + RedisTimeSeries module)
  #    Compatible: Redis Stack, DragonflyDB, Valkey (with TS module)
  # ══════════════════════════════════════════════════════════════════════════

  # Building 8 Redis TimeSeries (self-hosted)
  # TTL: ref:storedAt bldg:database8
  database8:
    type: redis_timeseries
    url: "${REDIS_TS_URL:-redis://redis:6379/1}"
    password: "${REDIS_TS_PASSWORD:-}"
    key_prefix: "${REDIS_TS_KEY_PREFIX:-sensor}"

  # Redis Stack Cloud (Redis Cloud with modules)
  # TTL: ref:storedAt bldg:redis-cloud
  redis-cloud:
    type: redis_timeseries
    url: "${REDIS_CLOUD_URL:-}"
    password: "${REDIS_CLOUD_PASSWORD:-}"
    key_prefix: "${REDIS_CLOUD_KEY_PREFIX:-sensor}"

  # DragonflyDB (Redis-compatible drop-in replacement)
  # TTL: ref:storedAt bldg:dragonfly
  dragonfly:
    type: redis_timeseries
    url: "${DRAGONFLY_URL:-redis://dragonfly:6379/1}"
    password: "${DRAGONFLY_PASSWORD:-}"
    key_prefix: "${DRAGONFLY_KEY_PREFIX:-sensor}"

  # Valkey (open-source Redis fork, Linux Foundation)
  # TTL: ref:storedAt bldg:valkey
  valkey:
    type: redis_timeseries
    url: "${VALKEY_URL:-redis://valkey:6379/1}"
    password: "${VALKEY_PASSWORD:-}"
    key_prefix: "${VALKEY_KEY_PREFIX:-sensor}"


