# OntoSage 3.0: Production-Grade Agentic AI Docker Compose Configuration
# 10 Agents | 14 Intents | Phase 7 services (Response Cache, Agent Memory, WebSocket, i18n)
# Default MODEL_PROVIDER: openai (gpt-4o-mini) — switch to local for Ollama GPU
# Local volumes + Host MySQL on port 3306
# Usage: docker-compose up -d

networks:
  ontobot-agentic:
    driver: bridge
  ontobot-network:
    external: true  # Connect to existing MySQL network with sensor data

volumes:
  # External volume - reuse existing MySQL data with sensor UUIDs
  mysql-data:
    external: true
    name: ontobot_mysql-data

  # ── Internal named volumes (all history preserved across restarts) ──────
  redis-data:          # Session cache, response cache, QA pair cache
    driver: local
  qdrant-data:         # Vector DB for agent memory (Phase 7.4)
    driver: local
  graphdb-data:        # Ontology + similarity index
    driver: local
  mongo-data:          # Chat history
    driver: local
  postgres-user-data:  # User accounts, passwords, RBAC roles
    driver: local
  pgadmin-data:        # pgAdmin UI settings
    driver: local
  artifacts-data:      # Generated plots, reports, exports
    driver: local
  open-webui-data:     # Open WebUI conversation history
    driver: local

services:
  # ====================== Local LLM (Ollama) with GPU ======================
