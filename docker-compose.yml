  # ====================== GraphDB (Replaces Fuseki + Qdrant) ======================
  graphdb:
    image: ontotext/graphdb:10.7.4
    container_name: graphdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:7200:7200"
      - "127.0.0.1:7300:7300"  # gRPC port
    volumes:
      - ./volumes/graphdb:/opt/graphdb/home
      - ./input:/opt/graphdb/import:ro
    environment:
      - GDB_HEAP_SIZE=4g
      - GDB_MIN_MEM=2g
      - GDB_MAX_MEM=8g
      - GDB_JAVA_OPTS=-Xmx8g -Xms2g -XX:MaxDirectMemorySize=2g
    networks:
      - ontobot-agentic
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7200/rest/repositories"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ====================== MySQL Host Connection Note ======================
  # MySQL is running LOCALLY on the host at port 3306.
  # The orchestrator connects via MYSQL_HOST=host.docker.internal:3306
  # The mysql container below is DISABLED — use host MySQL instead.
  # To re-enable, uncomment and set MYSQL_HOST=mysql in orchestrator env.
