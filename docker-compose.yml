  # ====================== Dummy Data Publisher ======================
  # NOTE: This service publishes dummy sensor data to MySQL.
  # With host MySQL mode, it connects via host.docker.internal:3306.
  # To re-enable mysql container mode: uncomment mysql service and restore depends_on below.
  data-publisher:
    build:
      context: ./mysql-dummy-publish-dev
      dockerfile: Dockerfile
    container_name: data-publisher
    environment:
      - MYSQL_HOST=host.docker.internal  # ← host MySQL (was: mysql-bldg1)
      # - MYSQL_HOST=mysql-bldg1         # ← uncomment for containerised MySQL
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-mysql}
      - MYSQL_DB=${MYSQL_DATABASE:-sensordb}
      - MYSQL_TABLE=sensor_data
      - PUBLISH_INTERVAL=30
    # depends_on:          # ← uncomment if using mysql container
    #   mysql:
    #     condition: service_healthy
    networks:
      - ontobot-agentic
    restart: unless-stopped

  # ====================== User Data & History (PostgreSQL) ======================
  postgres-user-data:
    image: postgres:15-alpine
    container_name: postgres-user-data
    hostname: postgres-user-data
    ports:
      - "5433:5432"  # 5433 on host to avoid conflict with ThingsBoard
    volumes:
      - ./volumes/postgres-user-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${POSTGRES_USER_DB:-ontobot}
      - POSTGRES_USER=${POSTGRES_USER_USER:-ontobot}
      - POSTGRES_PASSWORD=${POSTGRES_USER_PASSWORD:-ontobot_secret}
    networks:
      - ontobot-agentic
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ontobot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

