  # ====================== File Server (Artifacts) ======================
  file-server:
    image: nginx:alpine
    container_name: file-server-artifacts
    ports:
      - "8080:80"
    volumes:
      - ./volumes/artifacts:/usr/share/nginx/html
    networks:
      - ontobot-agentic
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

