<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; margin: 0; padding: 40px; color: #1a1a2e; line-height: 1.6; }
    .header { border-bottom: 3px solid #0f3460; padding-bottom: 16px; margin-bottom: 24px; }
    .header h1 { font-size: 24px; color: #0f3460; }
    .header .meta { color: #666; font-size: 0.85em; margin-top: 4px; }
    .section { margin-bottom: 28px; }
    .section h2 { font-size: 18px; color: #16213e; border-bottom: 1px solid #ddd; padding-bottom: 6px; margin-bottom: 12px; }
    .kpi-grid { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; }
    .kpi-card { background: #f0f4f8; border-radius: 8px; padding: 16px 20px; min-width: 180px; flex: 1; }
    .kpi-card .label { font-size: 0.8em; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
    .kpi-card .value { font-size: 1.8em; font-weight: 700; color: #0f3460; }
    .kpi-card .unit { font-size: 0.75em; color: #888; }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    th { background: #16213e; color: white; padding: 8px 12px; text-align: left; font-size: 0.85em; }
    td { padding: 7px 12px; border-bottom: 1px solid #e0e0e0; font-size: 0.9em; }
    tr:nth-child(even) { background: #fafafa; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.75em; font-weight: 600; }
    .badge-high { background: #fee2e2; color: #991b1b; }
    .badge-medium { background: #fef3c7; color: #92400e; }
    .badge-low { background: #d1fae5; color: #065f46; }
    .badge-pass { background: #d1fae5; color: #065f46; }
    .badge-fail { background: #fee2e2; color: #991b1b; }
    .narrative { background: #f8fafc; border-left: 4px solid #0f3460; padding: 16px 20px; margin: 16px 0; white-space: pre-wrap; }
    .footer { margin-top: 40px; padding-top: 16px; border-top: 1px solid #ddd; font-size: 0.75em; color: #888; }
    ul { padding-left: 20px; }
    li { margin-bottom: 4px; }
    {% block extra_styles %}{% endblock %}
  </style>
</head>
<body>
  <div class="header">
    <h1>{{ title }}</h1>
    <div class="meta">{{ building_name }} | Generated: {{ generated_at }} | {{ report_type | title }} Report</div>
  </div>

  {% block content %}{% endblock %}

  <div class="footer">
    Generated by OntoSage Smart Building Intelligence | {{ building_name }} | {{ generated_at }}
  </div>
</body>
</html>
