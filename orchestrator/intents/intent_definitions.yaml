# Intent registry (Phase 6 — 2026-05-29)
#
# Single source of truth for the system's intent taxonomy.  Edit this file to:
#   - Add a new intent: append an entry below; restart the orchestrator
#   - Tune disambiguation: edit the `description` block (the LLM sees it)
#   - Add new triggers: extend an intent's description with the new phrases
#   - Mark an intent uncacheable: set `cacheable: false`
#   - Add aliases: list synonyms under `aliases:`
#
# Consumers that read from this file (do NOT maintain separate hardcoded lists):
#   * orchestrator/agents/dialogue_agent.py        — LLM intent prompt
#   * orchestrator/services/multi_intent_detector  — VALID_INTENTS
#   * orchestrator/agents/planner_agent.py         — pipeline group sets
#
# Schema per entry:
#   name:           canonical intent string (must be globally unique)
#   description:    paragraph shown to the LLM (controls classification)
#   examples:       2-5 example user queries shown to the LLM
#   pipeline_group: 'data' | 'standalone' | 'meta'
#     - data:       needs sparql/sql prefix (sensor_data, analytics, anomaly, ...)
#     - standalone: self-contained (floor_plan, spatial_query, capability, ...)
#     - meta:       routing primitives (clarification, greeting, planner)
#   aliases:        legacy or synonymous names that also resolve here
#   cacheable:      true | false (defaults to true)

intents:
  - name: general
    description: |-
      Open-domain general-knowledge questions the LLM can answer directly —
      definitions, explanations, how-things-work, world facts, coding help, and
      "what can you do". NOT for building-specific data (sensors, zones, energy,
      occupancy) — those use the data pipeline. The dedicated general_knowledge
      node generates the answer with user-controlled length (short/summary/long).
    examples:
      - '"What is the capital of France?"'
      - '"Explain how photosynthesis works."'
      - '"Write a Python function to reverse a string."'
      - '"What is HVAC?"'
      - '"What can you do?"'
    # Group stays "meta" (not "standalone") so "general" is NOT added to the
    # floor-plan override's _data_intents exclusion set — a query the LLM
    # misclassifies as general ("show me the floor plan of floor 3") must still
    # be stealable by the floor_plan keyword override. The explicit route_target
    # + node_method below auto-wire the dedicated answering node regardless.
    pipeline_group: meta
    route_target: general_knowledge
    node_method: _general_knowledge_node
    cacheable: false

  - name: metadata
    description: Static structure queries — list entities, look up types, describe a thing.
    examples:
      - '"What sensors are in zone 5?"'
      - '"What type of sensor is X?"'
      - '"List all floors."'
    pipeline_group: data

  - name: discovery
    description: Explore available sensors, zones, data types, system capabilities.
    examples:
      - '"What can I monitor?"'
      - '"Show me all available data types."'
      - '"How many sensors does the building have?"'
    pipeline_group: data
    cacheable: false

  - name: analytics
    description: |-
      ONLY for direct statistical computation on a single dataset — averages, min/max, sums,
      counts, histograms, distribution, current readings. NOT for comparisons, NOT for recommendations.
    examples:
      - '"What is the average CO2 last week?"'
      - '"Show temperature history for zone 5."'
      - '"Current humidity?"'
    pipeline_group: data

  - name: compare
    description: |-
      Side-by-side comparison of TWO OR MORE sensors, zones, floors, or time periods.
      ALWAYS use this when the user says "compare", "vs", "versus", "difference between",
      "higher/lower than", "which is better/worse", or names two distinct things.
    examples:
      - '"Compare air quality between floor 1 and floor 5."'
      - '"Is zone 3 hotter than zone 5?"'
      - '"How does this week compare to last week?"'
    aliases: [comparison]
    pipeline_group: data

  - name: trend
    description: |-
      How a single metric has CHANGED OVER TIME — increasing, decreasing, stable, rate of change.
      Also handles FORECASTS and PREDICTIONS about future values.
      Trigger phrases: "trend", "trending", "changed over", "going up/down",
      "predict", "forecast", "predict temperature", "what will", "tomorrow",
      "next week", "expected to be", "likely to be", "projection".
    examples:
      - '"Is energy consumption trending up?"'
      - '"How has CO2 changed since Monday?"'
      - '"Is temperature rising?"'
      - '"Predict temperature for tomorrow afternoon."'
      - '"Forecast energy usage for next week."'
    aliases: [forecast]
    pipeline_group: data

  - name: recommend
    description: |-
      Request ACTIONABLE ADVICE — what to change, how to improve, what settings to use.
      ALWAYS use this when the user says "recommend", "suggest", "should I", "how can I improve",
      "what settings", "optimize", "what should I do", "tips", "advice".
    examples:
      - '"What HVAC settings do you recommend?"'
      - '"How can I improve air quality?"'
      - '"Suggest energy saving measures."'
    pipeline_group: data

  - name: anomaly
    description: Detect out-of-range, spike, drop, or unusual sensor readings.
    examples:
      - '"Any unusual readings today?"'
      - '"Are there temperature spikes?"'
      - '"Detect anomalies in CO2."'
    pipeline_group: data

  - name: report
    description: Generate a structured building report (daily/weekly summary, full energy report).
    examples:
      - '"Generate a weekly energy report."'
      - '"Create a building summary."'
      - '"Daily occupancy report."'
    pipeline_group: data
    route_target: planner       # report is multi-step; planner orchestrates

  - name: export
    description: Export query results or report to a file (CSV, JSON, HTML, Markdown).
    examples:
      - '"Export last week''s data as CSV."'
      - '"Download the report as JSON."'
    pipeline_group: data
    route_target: export        # standalone export node, no SPARQL needed when uuids known
    node_method: _export_node

  - name: compliance
    description: Check sensor readings against regulatory or comfort standards (ASHRAE, WELL, BREEAM, EN15251).
    examples:
      - '"Is zone 5 within ASHRAE 55 limits?"'
      - '"Check BREEAM compliance."'
      - '"Is CO2 within safe limits?"'
    pipeline_group: data

  - name: planner
    description: Multi-step task requiring multiple agents or producing multiple outputs.
    examples:
      - '"Generate CO2 report and export as CSV."'
      - '"Analyse energy, then create a chart and export."'
    pipeline_group: meta
    route_target: planner
    node_method: _planner_node

  - name: deliberate
    description: |-
      Multi-constraint SPACE RECOMMENDATION over live or forecast sensor data: the
      user wants a place chosen, ranked, or found under comfort/environment
      constraints — "where can I sit that's quiet with good air near water",
      "which room on floor 1 is the quietest", "rank the zones by CO2",
      "show me the zone with minimum occupancy". Compiles the constraints,
      verifies the building's own coverage, fetches per-room readings (and
      forecasts for future-tense questions), ranks with a deterministic scorer,
      and answers WITH a proof-of-analysis dossier. NOT for single-sensor
      readings (sensor_data), single-space analytics (analytics), or static
      floor-plan lookups (floor_plan).
    examples:
      - '"Where can I sit tomorrow that is quiet, with good air, near drinking water?"'
      - '"Which room on floor 1 is the quietest right now?"'
      - '"Show me the zone with minimum occupancy."'
      - '"Rank the meeting rooms by CO2."'
    pipeline_group: standalone
    node_method: _deliberate_node

  - name: control
    description: |-
      User issues a command to physically change a building system state.
      Entities: device (the system to control), action (set/on/off/lock/unlock/increase/decrease),
      target_value (e.g. "21°C", "50%"), zone/room.
    examples:
      - '"Set HVAC zone 3 to 21°C"'
      - '"Turn off the lights in room 2.04"'
      - '"Lock down floor 4"'
      - '"Increase ventilation in Lab 3.07"'
    pipeline_group: standalone
    cacheable: false
    node_method: _control_node

  # ── Phase 19 — Unified user-report intake ────────────────────────────────────
  # maintenance / complaint / feedback / safety_report / suggestion all route to
  # the SAME node (_report_intake_node); the node maps intent → report category
  # and persists to the `user_reports` Postgres table (admin-triaged in pgAdmin).
  # Adding a new report category = add an intent here + an INTENT_TO_CATEGORY
  # entry in report_intake_service.py.  No workflow.py edits.
  - name: maintenance
    description: |-
      User reports a fault / broken equipment, raises a work order, checks the status
      of an existing report, OR queries what maintenance is scheduled/planned.
      Trigger phrases: "broken", "not working", "report fault", "raise ticket",
      "fix the", "maintenance request", "the light/heater/lift is", "status of REP-",
      "maintenance work", "maintenance schedule", "scheduled maintenance",
      "planned maintenance", "what maintenance", "maintenance this week/month",
      "outstanding maintenance", "open maintenance tickets".
      Entities: device, location, fault_description, report_id (format REP-XXXXXX).
    examples:
      - '"the light in room 3.01 is broken"'
      - '"report a fault: the heater on floor 2 is not working"'
      - '"what is the status of REP-A1B2C3"'
      - '"What maintenance work is scheduled this week?"'
      - '"Show me all open maintenance tickets."'
    pipeline_group: standalone
    cacheable: false
    node_method: _report_intake_node

  - name: complaint
    description: |-
      User complains about a building condition or experience (noise, smell,
      cleanliness, crowding, discomfort that is not a hardware fault).
      Trigger phrases: "complain", "complaint", "too noisy", "it smells",
      "not clean", "unhappy with", "this is unacceptable".
    examples:
      - '"I want to complain about the noise from the plant room"'
      - '"the toilets on floor 4 are not clean"'
    pipeline_group: standalone
    cacheable: false
    node_method: _report_intake_node

  - name: feedback
    description: |-
      User gives general feedback or a compliment about the building or service —
      not a fault and not a complaint requiring action.
      Trigger phrases: "feedback", "I think", "it would be nice", "I like",
      "the new ... is great".
    examples:
      - '"I wanted to give feedback that the new lighting is much better"'
      - '"feedback: the reception staff were very helpful"'
    pipeline_group: standalone
    cacheable: false
    node_method: _report_intake_node

  - name: safety_report
    description: |-
      User reports a SAFETY hazard or concern: fire risk, blocked fire exit,
      trip hazard, gas/smell, electrical danger, spill, injury risk.
      Trigger phrases: "safety", "hazard", "dangerous", "fire exit blocked",
      "trip hazard", "gas smell", "exposed wire", "someone could get hurt".
    examples:
      - '"the fire exit on floor 3 is blocked by boxes"'
      - '"there is a trip hazard near the lifts"'
    pipeline_group: standalone
    cacheable: false
    node_method: _report_intake_node

  - name: suggestion
    description: |-
      User suggests an improvement or new facility — not urgent, not a fault.
      Trigger phrases: "suggest", "suggestion", "could you add", "it would help if",
      "please consider", "idea".
    examples:
      - '"suggestion: please add more bike racks outside"'
      - '"it would help if the cafe opened earlier"'
    pipeline_group: standalone
    cacheable: false
    node_method: _report_intake_node

  - name: clarification
    description: Query is too vague to proceed without more information.
    examples:
      - '"Show me data." (no sensor/zone specified)'
      - '"What happened?" (no context)'
    pipeline_group: meta
    cacheable: false

  - name: floor_plan
    description: |-
      User wants to see a floor plan, locate a room/zone/sensor on a floor, navigate the
      building layout, or get a building overview.  ALWAYS use this when the user says:
      "floor plan", "show me floor", "layout", "where is [room/zone/facility]", "which floor is",
      "locate", "find my location", "building map", "navigate", "directions to", "how do I get to",
      "where can I find", "building directory", "building overview", "all floors",
      "which floor has", "find the office", "where is the lab", "server room location",
      "toilet", "meeting room location", "lift", "elevator", "staircase", or mentions a floor
      number with spatial/location intent.
    examples:
      - '"Show me floor 3 plan."'
      - '"Where is zone 5.12?"'
      - '"Which floor am I on?"'
      - '"Where is the server room?"'
      - '"Give me a building overview."'
    pipeline_group: standalone
    node_method: _floor_plan_node

  - name: spatial_query
    description: |-
      User asks quantitative/analytical geometry questions about the building — room sizes,
      areas, adjacency relationships, counts, or MEP block locations.  Use this when the user
      asks ABOUT DATA derived from the floor plan, not to SEE it.
      DISAMBIGUATION: "show me / where is / find" → "floor_plan".
                      "how many / area / size / adjacent" → "spatial_query".
    examples:
      - '"Which rooms are larger than 50 m²?"'
      - '"What is the total area of floor 3?"'
      - '"How many meeting rooms are on floor 4?"'
      - '"Which rooms are adjacent to 3.01?"'
    pipeline_group: standalone
    node_method: _spatial_query_node

  - name: sensor_data
    description: Current or historical sensor readings for a specific sensor.
    examples:
      - '"What is the current temperature in zone 5.28?"'
    pipeline_group: data

  - name: capability
    description: Off-ontology / building capability queries (policies, amenities, contacts).
    examples:
      - '"Where is the prayer room?"'
      - '"How do I report a fault?"'
    pipeline_group: standalone
    node_method: _capability_node

  - name: events
    description: |-
      Booking / reservation, work-order / ticket, and entrance-footfall questions
      answered from the building's interval-record store: "is the boardroom free
      at 3pm?", "which rooms are free this afternoon?", "how many open work
      orders?", "any overdue tickets?", "how busy was the entrance this morning?".
      NOT for comfort-constrained room recommendations (deliberate), fault
      REPORTS ("the door is broken" -> maintenance), or booking ACTIONS
      ("book me a room" -> control/decline).
    examples:
      - '"Is RM101 free at 3pm today?"'
      - '"How many open work orders are there?"'
      - '"How busy was the main entrance this morning?"'
    pipeline_group: standalone
    node_method: _events_node

  - name: privacy_refusal
    description: |-
      INTERNAL refusal lane (deterministic rule only — do not classify into
      this): questions that would identify or track an INDIVIDUAL (who is in a
      room, badge history, CCTV content, other users' data) or ask to bypass
      access policies. Answered with the standing privacy policy and an
      aggregate alternative.
    examples:
      - '"Is the professor in her office right now?"'
    pipeline_group: standalone
    node_method: _privacy_refusal_node

  - name: diagnosis
    description: |-
      Indirect WHY-questions about a past condition: "why was floor 2 freezing
      on Tuesday?", "why is it so stuffy in RM125?". Assembles evidence (series
      stats, anomaly episodes, open windows, reports) and answers with ranked
      candidate explanations in correlation language. NOT for live readings
      (sensor_data), not for "any anomalies?" (anomaly), not for filing faults.
    examples:
      - '"Why was floor 2 freezing on Tuesday?"'
      - '"Why is it so stuffy in RM125?"'
    pipeline_group: standalone
    node_method: _diagnosis_node

  - name: register
    description: |-
      Compliance-REGISTER questions answered from dated ComplianceCheck records:
      "which compliance checks are overdue?", "what's due this month?", "when was
      the fire alarm last tested?", "when was the legionella flush last done?".
      NOT for checking SENSOR READINGS against standards (that is 'compliance':
      "is CO2 within safe limits?") and NOT for filing faults (maintenance).
    examples:
      - '"Which compliance checks are overdue?"'
      - '"When was the fire alarm last tested?"'
      - '"What inspections are due this month?"'
    pipeline_group: standalone
    node_method: _register_node

  - name: visualization
    description: Plot or chart a metric.
    examples:
      - '"Plot temperature in zone 5.28 over the last 24h."'
    pipeline_group: data
    route_target: visualization   # viz node is downstream of SPARQL+SQL but LLM can return it directly
    node_method: _visualization_node

  - name: alert
    description: |-
      Threshold-based alert management — create, list, or delete personal sensor alerts.
      Trigger phrases for CREATE: "alert me if", "notify me when", "warn me if",
      "set an alert", "remind me when", "tell me if X exceeds/drops below".
      Trigger phrases for LIST: "list my alerts", "show my alerts", "what alerts do I have".
      Trigger phrases for DELETE: "delete alert", "remove alert", "cancel alert", "stop alerting me".
      Use ONLY when the user is explicitly managing alert rules — NOT for viewing current sensor
      values (use sensor_data or analytics for that).
    examples:
      - '"Alert me if CO2 exceeds 1000 ppm in any zone"'
      - '"Notify me when temperature in room 5.01 goes above 28 degrees"'
      - '"Set an alert for humidity below 30% on floor 2"'
      - '"List my alerts"'
      - '"Delete alert abc12345"'
    pipeline_group: standalone
    route_target: alert_mgmt
    node_method: _alert_mgmt_node

  - name: preference_management
    description: |-
      User states, recalls, or deletes their personal comfort preferences — not a sensor query.
      Trigger phrases for STORE: "remember I prefer", "I like it warmer", "my ideal temperature is",
      "set my comfort preferences", "I find it too cold", "comfortable between X and Y".
      Trigger phrases for LIST: "what are my preferences", "show my settings".
      Trigger phrases for FORGET: "forget my temperature preference", "clear my preferences".
      Requires authenticated user — guests are politely declined.
      Distinct from sensor_data (which reads current values) and analytics (which computes them).
    examples:
      - '"Remember that I prefer temperatures between 22 and 24 degrees"'
      - '"I like it warmer — set my comfort preference to 23°C"'
      - '"What are my personal comfort preferences?"'
      - '"Forget my temperature preference"'
      - '"I find it too cold in here — my ideal is 22 to 24 degrees"'
    pipeline_group: standalone
    route_target: preference_management
    node_method: _preference_management_node

  - name: automation_capability
    description: |-
      Questions about whether the building CAN automatically perform an action or respond to a
      condition — capability questions, not commands. These ask "can/could/will/would the building
      automatically X when Y?" or "is there a way for it to auto-detect/notify/adjust...?".
      Distinct from 'alert' (which creates a rule) and 'control' (which issues a command).
      Answer TRUTHFULLY: monitoring + notify is available today via rules engine; physical
      actuation needs a BMS driver (not yet configured). Offer to set up an alert rule.
    examples:
      - '"Can the building automatically alert me when CO2 gets too high?"'
      - '"Will the HVAC adjust by itself if a room gets too warm?"'
      - '"Is there a way for the system to detect a water leak automatically?"'
      - '"Could the building automatically send me a message if there is a fault?"'
      - '"Can it monitor energy use and notify me if it spikes?"'
    pipeline_group: standalone
    route_target: automation_capability_check
    node_method: _automation_capability_check_node

  - name: greeting
    description: Friendly greeting; no information request.
    examples:
      - '"Hi"'
      - '"Good morning"'
    pipeline_group: meta
    cacheable: false

  # Questions about the ASSISTANT rather than the building. Without this they reach
  # the open-domain answerer, which has no knowledge of this system and invents a
  # plausible substitute — observed live as "I'm a large-language model built by
  # OpenAI" and a capability list naming none of OntoSage's actual abilities.
  - name: self_description
    description: |-
      The user is asking about OntoSage ITSELF — what it is, what it can do, how it
      works, what kinds of question it accepts. NOT about the building's equipment,
      sensors, spaces or policies; those are the data intents. Answered from the live
      intent registry and the active building's own data, never from a fixed script.
    examples:
      - '"What is OntoSage?"'
      - '"What can you do?"'
      - '"How do you work?"'
      - '"What kind of questions can I ask you?"'
      - '"What are your capabilities?"'
    pipeline_group: meta
    route_target: self_description
    node_method: _self_description_node
